<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ultimate Quiz Challenge — Live Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2305060a%22/><rect x=%2218%22 y=%2218%22 width=%2228%22 height=%2228%22 fill=%22%23ff4757%22/><rect x=%2254%22 y=%2218%22 width=%2228%22 height=%2228%22 fill=%22%232ed573%22/><rect x=%2218%22 y=%2254%22 width=%2228%22 height=%2228%22 fill=%22%23ffc93c%22/><rect x=%2254%22 y=%2254%22 width=%2228%22 height=%2228%22 fill=%22%234c6fff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#05060a;
  --bg-grid: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
  --panel:#0e1019;
  --panel-2:#151827;
  --panel-3:#1b1f31;
  --border:#262a3d;
  --border-soft:#1a1d2b;
  --text:#eef0f7;
  --text-dim:#8b90a8;
  --text-faint:#565c78;
  --gold:#ffb020;
  --gold-dim:#8a611f;
  --red:#ff4757;
  --green:#2ed573;
  --yellow:#ffc93c;
  --blue:#4c6fff;
  --math:#2ec4ff;
  --sci:#16c79a;
  --soc:#ff9f45;
  --gk:#a66cff;
  --eng:#ff5c8a;
  --radius-sm:9px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(180deg, rgba(76,111,255,0.06), transparent 320px),
    var(--bg-grid) 0 0/22px 22px,
    var(--bg);
  color:var(--text);
  font-family:'Space Grotesk', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono', 'Courier New', monospace;}
h1,h2,h3,h4{margin:0; font-family:'Space Grotesk', sans-serif; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold); color:#1a1200;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ===== App shell ===== */
#app{display:flex; flex-direction:column; min-height:100vh;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:18px;
  padding:12px 22px;
  background:rgba(9,10,16,0.86);
  backdrop-filter: blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand-mark{width:30px; height:30px; border-radius:8px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; flex-shrink:0;}
.brand-mark span{display:block;}
.brand-mark span:nth-child(1){background:var(--red);}
.brand-mark span:nth-child(2){background:var(--green);}
.brand-mark span:nth-child(3){background:var(--yellow);}
.brand-mark span:nth-child(4){background:var(--blue);}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text strong{font-size:14.5px; font-weight:700; letter-spacing:-0.01em;}
.brand-text small{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.04em;}

.tabs{display:flex; gap:4px; background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:4px; flex:1; min-width:0; overflow-x:auto;}
.tab-btn{
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  padding:9px 14px; border-radius:9px; border:none; background:transparent;
  color:var(--text-dim); font-weight:600; font-size:13px; transition:background .15s, color .15s;
}
.tab-btn svg{width:15px; height:15px; flex-shrink:0;}
.tab-btn:hover{color:var(--text); background:var(--panel-2);}
.tab-btn.active{color:#0a0a0f; background:var(--gold);}

.topbar-stats{display:flex; align-items:center; gap:16px; flex-shrink:0;}
.stat-chip{display:flex; flex-direction:column; align-items:flex-end; line-height:1.15;}
.stat-chip .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;}
.stat-chip .l{font-size:9.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.05em;}

.view{flex:1; padding:22px; max-width:1440px; width:100%; margin:0 auto; display:none;}
.view.active{display:block;}

/* ===== Generic building blocks ===== */
.panel{
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:20px;
}
.panel-title{font-size:12px; font-weight:700; color:var(--text-faint); letter-spacing:0.06em; margin-bottom:14px;}
.btn{
  border:1px solid var(--border);
  background:var(--panel-3);
  color:var(--text);
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:13.5px;
  transition:transform .1s ease, background .15s, border-color .15s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{background:#232739; border-color:#333853;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); border-color:var(--gold); color:#181000;}
.btn-primary:hover{background:#ffc043;}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:0.35; cursor:not-allowed; pointer-events:none;}

.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:100px; font-size:11.5px; font-weight:700; letter-spacing:0.03em;}

.progress-track{height:7px; border-radius:6px; background:var(--panel-3); overflow:hidden; position:relative;}
.progress-fill{height:100%; border-radius:6px; transition:width .4s cubic-bezier(.2,.8,.3,1);}

.grid-2{display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
@media (max-width: 900px){ .grid-2{grid-template-columns:1fr;} }

.empty-note{color:var(--text-faint); font-size:13px; padding:20px; text-align:center;}

/* ===== Subject tabs ===== */
.subject-tabs{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.subject-tab{
  flex:1; min-width:160px;
  background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:12px 14px; text-align:left; color:var(--text);
  position:relative; overflow:hidden;
}
.subject-tab .top-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.subject-tab .name{font-weight:700; font-size:12.5px; letter-spacing:0.01em;}
.subject-tab .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);}
.subject-tab.active{border-color:var(--sub-color, var(--gold)); box-shadow:0 0 0 1px var(--sub-color, var(--gold)) inset;}
.subject-tab::after{content:""; position:absolute; left:0; top:0; height:3px; width:100%; background:var(--sub-color,var(--gold)); opacity:.9;}

/* ===== Question navigator ===== */
.qnav-panel{position:sticky; top:76px;}
.qnav-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
.qnav-cell{
  aspect-ratio:1; border-radius:9px; border:1px solid var(--border);
  background:var(--panel-3); color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  position:relative; transition:transform .1s;
}
.qnav-cell:hover{transform:translateY(-1px); border-color:#3a4060;}
.qnav-cell.st-correct{background:rgba(46,213,115,0.16); border-color:var(--green); color:var(--green);}
.qnav-cell.st-wrong{background:rgba(255,71,87,0.14); border-color:var(--red); color:var(--red);}
.qnav-cell.st-partial{background:rgba(255,201,60,0.14); border-color:var(--yellow); color:var(--yellow);}
.qnav-cell.current{outline:2px solid var(--gold); outline-offset:2px;}
.qnav-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; font-size:11px; color:var(--text-faint);}
.qnav-legend .dot{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px;}

/* ===== Question card (Score Control) ===== */
.qcard{padding:26px;}
.qcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
.qcard-num{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:700; line-height:1;}
.qcard-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;}
.team-pill{padding:5px 13px; border-radius:100px; font-weight:700; font-size:12px; letter-spacing:0.02em;}
.diff-pill{padding:5px 13px; border-radius:100px; font-weight:700; font-size:12px; letter-spacing:0.02em; background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim);}
.max-badge{text-align:right;}
.max-badge .v{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--gold);}
.max-badge .l{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.05em;}

.mark-grid{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0;}
.mark-btn{
  width:72px; height:72px; border-radius:16px; border:1.5px solid var(--border);
  background:var(--panel-3); color:var(--text);
  font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700;
  transition:all .12s ease;
}
.mark-btn:hover{border-color:var(--gold); transform:translateY(-2px);}
.mark-btn.selected{background:var(--gold); border-color:var(--gold); color:#181000; transform:translateY(-2px); box-shadow:0 6px 18px rgba(255,176,32,0.35);}
.mark-btn.pending{outline:2px dashed var(--gold); outline-offset:3px;}

.quick-actions{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.qa-btn{flex:1; min-width:120px; padding:13px; border-radius:12px; font-weight:700; font-size:13px; border:1.5px solid var(--border); background:var(--panel-3); color:var(--text-dim); letter-spacing:0.03em;}
.qa-btn.correct-btn:hover{border-color:var(--green); color:var(--green);}
.qa-btn.partial-btn:hover{border-color:var(--yellow); color:var(--yellow);}
.qa-btn.wrong-btn:hover{border-color:var(--red); color:var(--red);}

.qcard-footer{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap;}
.save-btn{padding:14px 34px; font-size:14.5px; border-radius:12px;}
.nav-btns{display:flex; gap:8px;}

.save-flash{
  position:fixed; top:90px; left:50%; transform:translateX(-50%) translateY(-10px); opacity:0;
  background:var(--green); color:#062; font-weight:700; padding:11px 22px; border-radius:100px;
  font-size:13.5px; box-shadow:0 10px 30px rgba(46,213,115,0.4); pointer-events:none; z-index:100;
  transition:opacity .25s, transform .25s;
  display:flex; align-items:center; gap:8px;
}
.save-flash.show{opacity:1; transform:translateX(-50%) translateY(0);}
.save-flash svg{width:18px; height:18px; flex-shrink:0;}
.save-flash{white-space:nowrap;}

.kbd-hint{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; font-size:11px; color:var(--text-faint);}
.kbd-hint kbd{background:var(--panel-3); border:1px solid var(--border); border-radius:5px; padding:2px 6px; font-family:'IBM Plex Mono',monospace; color:var(--text-dim); margin-right:4px;}

/* ===== Quick mode ===== */
.quick-wrap{max-width:1180px; margin:0 auto;}
.quick-question{text-align:center; margin-bottom:26px;}
.quick-question .qc-sub{color:var(--text-faint); font-weight:600; font-size:12.5px; letter-spacing:0.05em; margin-bottom:10px;}
.quick-question h2{font-size:22px; margin-bottom:4px;}
.team-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media (max-width:820px){.team-grid{grid-template-columns:repeat(2,1fr);}}
.team-panel{
  border-radius:var(--radius-lg); padding:20px; border:2px solid var(--border-soft); background:var(--panel);
  position:relative; transition:opacity .2s, border-color .2s; text-align:center;
}
.team-panel.is-target{border-color:var(--tc); box-shadow:0 0 0 1px var(--tc) inset, 0 12px 30px -10px var(--tc);}
.team-panel.is-off{opacity:0.4;}
.team-panel .tp-name{font-weight:700; font-size:15px; margin-bottom:2px;}
.team-panel .tp-sub{font-size:11px; color:var(--text-faint); margin-bottom:16px;}
.team-panel .tp-marks{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.team-panel .tp-mark-btn{
  width:44px; height:44px; border-radius:11px; border:1.5px solid var(--border); background:var(--panel-3);
  color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px;
}
.team-panel .tp-mark-btn.selected{background:var(--tc); border-color:var(--tc); color:#08090c;}
.team-panel .tp-locked-note{font-size:11px; color:var(--text-faint); font-style:italic; padding:10px 0;}
.next-q-bar{display:flex; justify-content:center; margin-top:30px;}
.next-q-btn{padding:17px 44px; font-size:16px; border-radius:14px;}

/* ===== Timer ===== */
.timer-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media (max-width:900px){.timer-wrap{grid-template-columns:1fr;}}
.timer-display{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:76px; text-align:center; letter-spacing:0.02em; margin:14px 0; transition:color .2s;}
.timer-display.low{color:var(--red); animation:pulse-warn 1s infinite;}
@keyframes pulse-warn{0%,100%{opacity:1;}50%{opacity:.45;}}
.timer-controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
.duration-row{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; justify-content:center;}
.dur-btn{padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--panel-3); color:var(--text-dim); font-weight:600; font-size:12.5px;}
.dur-btn.active{background:var(--gold); border-color:var(--gold); color:#181000;}
.custom-dur{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:8px;}
.custom-dur input{width:80px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel-3); color:var(--text); font-family:'IBM Plex Mono',monospace;}
.toggle-row{display:flex; gap:18px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.toggle{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); font-weight:600;}
.toggle input{accent-color:var(--gold); width:15px; height:15px;}
.fs-timer-btn{display:flex; justify-content:center; margin-top:16px;}
.notif-banner{
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-16px); opacity:0;
  background:var(--red); color:#fff; font-weight:700; padding:13px 26px; border-radius:14px;
  z-index:200; transition:all .25s; pointer-events:none; box-shadow:0 12px 30px rgba(255,71,87,.4);
}
.notif-banner.show{opacity:1; transform:translateX(-50%) translateY(0);}

#fullscreenTimer{
  position:fixed; inset:0; background:#000; z-index:500; display:none;
  align-items:center; justify-content:center; flex-direction:column;
}
#fullscreenTimer.show{display:flex;}
#fullscreenTimer .fs-num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:min(38vw,340px); line-height:1; color:var(--text);}
#fullscreenTimer .fs-num.low{color:var(--red);}
#fullscreenTimer .fs-exit{position:absolute; top:26px; right:26px;}
#fullscreenTimer .fs-label{color:var(--text-faint); font-size:16px; letter-spacing:0.1em; font-weight:600; margin-top:-10px;}

/* ===== Leaderboard ===== */
.lb-list{display:flex; flex-direction:column; gap:12px;}
.lb-row{
  display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center;
  background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:16px 20px; position:relative; overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.lb-row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--tc);}
.lb-rank{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--text-faint); text-align:center;}
.lb-rank.r1{color:var(--gold);}
.lb-team{display:flex; align-items:center; gap:12px;}
.lb-dot{width:14px; height:14px; border-radius:4px; background:var(--tc); flex-shrink:0;}
.lb-name{font-weight:700; font-size:16px;}
.lb-bar-wrap{margin-top:8px;}
.lb-score-block{text-align:right; min-width:190px;}
.lb-score{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700;}
.lb-score .max{color:var(--text-faint); font-size:15px; font-weight:600;}
.lb-detail-row{display:flex; gap:14px; margin-top:6px; justify-content:flex-end; font-size:11px; color:var(--text-faint);}
.lb-detail-row b{color:var(--text-dim);}

/* ===== Analytics ===== */
.analytics-section{margin-bottom:26px;}
.section-heading{font-size:13px; font-weight:700; color:var(--text-dim); letter-spacing:0.04em; margin-bottom:14px; display:flex; align-items:center; gap:10px;}
.section-heading::after{content:""; flex:1; height:1px; background:var(--border-soft);}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:1000px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.team-stat-card{border-radius:var(--radius-lg); padding:18px; background:var(--panel); border:1px solid var(--border-soft); border-top:3px solid var(--tc);}
.team-stat-card h4{font-size:15px; margin-bottom:14px;}
.mini-stat{display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; border-bottom:1px dashed var(--border-soft);}
.mini-stat:last-child{border-bottom:none;}
.mini-stat span:first-child{color:var(--text-faint);}
.mini-stat span:last-child{font-family:'IBM Plex Mono',monospace; font-weight:600;}

.subject-table{width:100%; border-collapse:separate; border-spacing:0 8px; font-size:12.5px;}
.subject-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; letter-spacing:0.04em; padding:0 12px 6px;}
.subject-table td{background:var(--panel); padding:12px; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);}
.subject-table td:first-child{border-left:1px solid var(--border-soft); border-radius:10px 0 0 10px;}
.subject-table td:last-child{border-right:1px solid var(--border-soft); border-radius:0 10px 10px 0;}
.subject-table td.num{font-family:'IBM Plex Mono',monospace; text-align:center;}

.diff-cards{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
@media (max-width:1000px){.diff-cards{grid-template-columns:repeat(2,1fr);}}
.diff-card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px;}
.diff-card h5{font-size:12.5px; margin-bottom:10px; color:var(--text-dim);}
.diff-mini{display:flex; justify-content:space-between; font-size:11px; padding:3px 0; color:var(--text-faint);}
.diff-mini b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.charts-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
@media (max-width:980px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px; height:300px; display:flex; flex-direction:column;}
.chart-box h5{font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:0.03em; margin-bottom:10px;}
.chart-box .chart-holder{flex:1; position:relative;}

.qa-table-wrap{max-height:480px; overflow:auto; border-radius:var(--radius-md); border:1px solid var(--border-soft);}
table.qa-table{width:100%; border-collapse:collapse; font-size:12px;}
table.qa-table th{position:sticky; top:0; background:#161a29; text-align:left; padding:9px 12px; color:var(--text-faint); font-weight:600; z-index:2;}
table.qa-table td{padding:8px 12px; border-top:1px solid var(--border-soft);}
table.qa-table tr:hover td{background:var(--panel-2);}
.filter-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.filter-chip{padding:6px 13px; border-radius:100px; border:1px solid var(--border); background:var(--panel-3); color:var(--text-dim); font-size:12px; font-weight:600;}
.filter-chip.active{background:var(--gold); border-color:var(--gold); color:#181000;}

/* ===== Grand Finale ===== */
.finale-stage{
  min-height:72vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; position:relative; border-radius:var(--radius-lg); overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%, #12162a 0%, #05060a 70%);
  border:1px solid var(--border-soft);
  padding:40px 20px;

<body>
<div id="app"></div>
<div class="credit-tag">Made by Cube_bold64 (Sanidhya Gulhane) — Cyber Minister, JDeMS</div>
<div id="fullscreenTimer">
  <button class="btn btn-ghost fs-exit" id="fsExitBtn">Exit fullscreen ✕</button>
  <div class="fs-num mono" id="fsNum">00:20</div>
  <div class="fs-label" id="fsLabel">QUESTION TIMER</div>
</div>

<script>
'use strict';
/* =========================================================
   DATA MODEL
   ========================================================= */
const TEAMS = [
  {key:'RED',    name:'Red',    color:'#ff4757', dark:false},
  {key:'GREEN',  name:'Green',  color:'#2ed573', dark:false},
  {key:'YELLOW', name:'Yellow', color:'#ffc93c', dark:true},
  {key:'BLUE',   name:'Blue',   color:'#4c6fff', dark:false},
];
const TEAM_BY_KEY = Object.fromEntries(TEAMS.map(t=>[t.key,t]));

const SUBJECTS = [
  {key:'MATH', name:'Mathematics',          short:'MATH', color:'#2ec4ff'},
  {key:'SCI',  name:'Science',              short:'SCI',  color:'#16c79a'},
  {key:'SOC',  name:'Social Science',       short:'SOC',  color:'#ff9f45'},
  {key:'GK',   name:'GK & Current Affairs', short:'GK',   color:'#a66cff'},
  {key:'ENG',  name:'English',              short:'ENG',  color:'#ff5c8a'},
];
const SUBJECT_BY_KEY = Object.fromEntries(SUBJECTS.map(s=>[s.key,s]));

const DIFFICULTIES = [
  {key:'EASY',     label:'Easy',      max:1},
  {key:'EASY_MID', label:'Easy-Mid',  max:2},
  {key:'MEDIUM',   label:'Medium',    max:3},
  {key:'MID_HARD', label:'Mid-Hard',  max:4},
  {key:'HARD',     label:'Hard',      max:5},
];
const DIFF_BY_KEY = Object.fromEntries(DIFFICULTIES.map(d=>[d.key,d]));

function buildQuestions(){
  const qs = [];
  let globalIndex = 0;
  SUBJECTS.forEach(subject=>{
    for(let n=1;n<=20;n++){
      const diff = DIFFICULTIES[Math.floor((n-1)/4)];
      const team = TEAMS[(n-1)%4];
      qs.push({
        id: subject.key+'-'+n,
        globalIndex: globalIndex++,
        subject: subject.key,
        numInSubject: n,
        difficulty: diff.key,
        maxMarks: diff.max,
        team: team.key,
      });
    }
  });
  return qs;
}
const QUESTIONS = buildQuestions(); // 100 questions, order = play order
const TOTAL_MARKS = QUESTIONS.reduce((s,q)=>s+q.maxMarks,0); // 300
const TEAM_MAX = {}; TEAMS.forEach(t=>{ TEAM_MAX[t.key] = QUESTIONS.filter(q=>q.team===t.key).reduce((s,q)=>s+q.maxMarks,0); }); // 75 each

/* =========================================================
   STATE
   ========================================================= */
const STORAGE_KEY = 'tuqc_live_control_v1';
const SYNC_CHANNEL = 'tuqc_sync_v1';

function defaultAnswerState(){
  const a = {};
  QUESTIONS.forEach(q=>{ a[q.id] = { marks:null, status:'unanswered', timeUsed:null }; });
  return a;
}

const DEFAULT_PRESETS = [
  {id:'p1', name:'Quick Answer', sec:10},
  {id:'p2', name:'Normal Question', sec:30},
  {id:'p3', name:'Buzzer', sec:15},
  {id:'p4', name:'Rapid Fire', sec:60},
  {id:'p5', name:'Final Round', sec:120},
];

const state = {
  activeTab: 'control',
  currentGlobalIndex: 0,
  currentSubject: 'MATH',
  answers: defaultAnswerState(),
  history: [], // undo stack: {qid, prev, label}
  pendingMark: null, // number key pressed but not yet confirmed with Enter
  qaFilter: 'ALL',
  saveStatus: 'idle', // idle | saved
  presentationMode: false,
  timer: {
    mode:'countdown', // countdown | stopwatch | clock
    duration:20, remaining:20, running:false, startTs:null, baseRemaining:20,
    swElapsedBase:0, swRunning:false, swStartTs:null, laps:[],
    clock12h:false,
    soundOn:true, notifOn:true, warnThreshold:5,
    displayMode:'standard', // compact | standard | large | fullscreen
    presets: DEFAULT_PRESETS.slice(),
    quizRunning:false, quizStartTs:null, quizElapsedBase:0,
  },
  settings:{
    autoAdvance:false,
    questionTimerAutoStart:false,
    questionTimerAutoReset:true,
    theme:'dark',
    density:'comfortable',
    animations:true,
  },
  questionTimerDurations: {}, // per-question override, id -> seconds
  finale: { step:0 },
  _suppressBroadcast:false,
};

function saveState(){
  try{
    const payload = {
      answers: state.answers,
      currentGlobalIndex: state.currentGlobalIndex,
      timer:{
        duration: state.timer.duration, soundOn:state.timer.soundOn, notifOn:state.timer.notifOn,
        warnThreshold: state.timer.warnThreshold, displayMode: state.timer.displayMode,
        presets: state.timer.presets, clock12h: state.timer.clock12h,
      },
      settings: state.settings,
      questionTimerDurations: state.questionTimerDurations,
      teams: TEAMS.map(t=>({key:t.key,name:t.name,color:t.color,dark:t.dark})),
      subjects: SUBJECTS.map(s=>({key:s.key,name:s.name})),
      savedAt: Date.now(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    state.saveStatus = 'saved';
  }catch(e){ console.warn('Could not save state', e); state.saveStatus='error'; }
}
function hasSavedProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const p = JSON.parse(raw);
    return p.answers && Object.values(p.answers).some(a=>a.status!=='unanswered');
  }catch(e){ return false; }
}
function applySavedPayload(payload){
  if(payload.answers){
    Object.keys(state.answers).forEach(id=>{
      if(payload.answers[id]) state.answers[id] = payload.answers[id];
    });
  }
  if(typeof payload.currentGlobalIndex==='number') state.currentGlobalIndex = payload.currentGlobalIndex;
  if(payload.timer){
    state.timer.duration = payload.timer.duration ?? 20;
    state.timer.remaining = state.timer.duration;
    state.timer.soundOn = payload.timer.soundOn ?? true;
    state.timer.notifOn = payload.timer.notifOn ?? true;
    state.timer.warnThreshold = payload.timer.warnThreshold ?? 5;
    state.timer.displayMode = payload.timer.displayMode ?? 'standard';
    state.timer.clock12h = payload.timer.clock12h ?? false;
    if(Array.isArray(payload.timer.presets) && payload.timer.presets.length) state.timer.presets = payload.timer.presets;
  }
  if(payload.settings) Object.assign(state.settings, payload.settings);
  if(payload.questionTimerDurations) state.questionTimerDurations = payload.questionTimerDurations;
  if(Array.isArray(payload.teams)){
    payload.teams.forEach(pt=>{
      const t = TEAM_BY_KEY[pt.key];
      if(t){ t.name = pt.name; t.color = pt.color; t.dark = pt.dark; }
    });
  }
  if(Array.isArray(payload.subjects)){
    payload.subjects.forEach(ps=>{
      const s = SUBJECT_BY_KEY[ps.key];
      if(s){ s.name = ps.name; }
    });
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    applySavedPayload(JSON.parse(raw));
  }catch(e){ console.warn('Could not load saved state', e); }
}
function clearSavedState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}


/* =========================================================
   UTILITIES
   ========================================================= */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function formatClock(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  if(h>0) return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  return `${pad2(m)}:${pad2(s)}`;
}
function questionByGlobalIndex(i){ return QUESTIONS[i]; }
function questionsForSubject(subjKey){ return QUESTIONS.filter(q=>q.subject===subjKey); }

function deriveStatus(marks, maxMarks){
  if(marks===null || marks===undefined) return 'unanswered';
  if(marks<=0) return 'wrong';
  if(marks>=maxMarks) return 'correct';
  return 'partial';
}

function setAnswer(qid, marks){
  const q = QUESTIONS.find(x=>x.id===qid);
  const prev = { ...state.answers[qid] };
  const clamped = clamp(marks, 0, q.maxMarks);
  state.answers[qid] = { marks: clamped, status: deriveStatus(clamped, q.maxMarks), timeUsed: state.answers[qid].timeUsed };
  state.history.push({ qid, prev });
  if(state.history.length>200) state.history.shift();
  saveState();
}
function resetAnswer(qid){
  const prev = { ...state.answers[qid] };
  state.answers[qid] = { marks:null, status:'unanswered', timeUsed:null };
  state.history.push({ qid, prev });
  saveState();
}
function undoLast(){
  const last = state.history.pop();
  if(!last) return false;
  state.answers[last.qid] = last.prev;
  saveState();
  return true;
}

/* Team / subject / difficulty stats — purely factual, no predictions */
function computeTeamStats(teamKey){
  const qs = QUESTIONS.filter(q=>q.team===teamKey);
  let score=0, correct=0, wrong=0, partial=0, unanswered=0, answered=0, remainingPossible=0;
  qs.forEach(q=>{
    const a = state.answers[q.id];
    if(a.status==='unanswered'){ unanswered++; remainingPossible += q.maxMarks; }
    else{
      answered++;
      score += (a.marks||0);
      if(a.status==='correct') correct++;
      else if(a.status==='wrong') wrong++;
      else if(a.status==='partial') partial++;
    }
  });
  const max = TEAM_MAX[teamKey];
  return { teamKey, score, max, pct: max? (score/max*100):0, correct, wrong, partial, unanswered, answered, total:qs.length, remainingPossible };
}
function computeSubjectStats(subjKey){
  const qs = questionsForSubject(subjKey);
  const subjMax = qs.reduce((s,q)=>s+q.maxMarks,0);
  const perTeam = {};
  TEAMS.forEach(t=>perTeam[t.key]=0);
  let answeredCount=0;
  qs.forEach(q=>{
    const a = state.answers[q.id];
    if(a.status!=='unanswered'){ perTeam[q.team]+=(a.marks||0); answeredCount++; }
  });
  const totalScored = Object.values(perTeam).reduce((a,b)=>a+b,0);
  return { subjKey, subjMax, perTeam, totalScored, pct: subjMax? totalScored/subjMax*100:0, answeredCount, total:qs.length };
}
function computeDifficultyStats(diffKey){
  const qs = QUESTIONS.filter(q=>q.difficulty===diffKey);
  const max = qs.reduce((s,q)=>s+q.maxMarks,0);
  let scored=0, correct=0, answered=0;
  const perTeam={}; TEAMS.forEach(t=>perTeam[t.key]={score:0,max:0});
  qs.forEach(q=>{
    perTeam[q.team].max += q.maxMarks;
    const a = state.answers[q.id];
    if(a.status!=='unanswered'){
      answered++; scored += (a.marks||0); perTeam[q.team].score += (a.marks||0);
      if(a.status==='correct') correct++;
    }
  });
  return { diffKey, max, scored, pct: max? scored/max*100:0, accuracy: answered? correct/answered*100:0, answered, total:qs.length, perTeam };
}
function overallProgress(){
  const answered = QUESTIONS.filter(q=>state.answers[q.id].status!=='unanswered').length;
  return { answered, total: QUESTIONS.length };
}

function ensureToastStack(){
  let el = $('#toastStack');
  if(!el){ el = document.createElement('div'); el.id='toastStack'; document.body.appendChild(el); }
  return el;
}
function toast(msg, kind='ok', opts={}){
  const stack = ensureToastStack();
  const el = document.createElement('div');
  el.className = 'toast '+(kind==='err'?'err':kind==='info'?'info':'');
  el.innerHTML = `<span class="t-msg">${esc(msg)}</span>${opts.undo?'<button class="t-undo">UNDO</button>':''}<span class="t-close">✕</span>`;
  stack.appendChild(el);
  const remove = ()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),200); };
  el.querySelector('.t-close').addEventListener('click', remove);
  if(opts.undo){
    el.querySelector('.t-undo').addEventListener('click', ()=>{ opts.undo(); remove(); });
  }
  const timeout = setTimeout(remove, opts.duration || 3200);
  el._removeTimer = timeout;
}
function flashSave(text){ toast(text, 'ok'); }

/* Keyboard shortcuts for Score Control */
document.addEventListener('keydown', (e)=>{
  if(state.activeTab!=='control') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if($('.modal-backdrop')) return;
  const q = currentQuestion();
  if(/^[0-9]$/.test(e.key)){
    const m = parseInt(e.key,10);
    if(m<=q.maxMarks){ state.pendingMark = m; renderControl(); }
    return;
  }
  switch(e.key){
    case 'Enter':{
      const m = state.pendingMark!==null ? state.pendingMark : (state.answers[q.id].marks ?? 0);
      setAnswer(q.id, m); state.pendingMark=null;
      toast('Saved'); rerenderAll();
      break;
    }
    case 'ArrowRight': case 'n': case 'N':
      goToQuestion(state.currentGlobalIndex+1); renderControl(); break;
    case 'ArrowLeft': case 'p': case 'P':
      goToQuestion(state.currentGlobalIndex-1); renderControl(); break;
    case 'u': case 'U':
      if(undoLast()){ toast('Undone','info'); rerenderAll(); }
      break;
    case 'r': case 'R':
      resetAnswer(q.id); toast('Question reset'); rerenderAll();
      break;
    case ' ': case 'Spacebar':
      e.preventDefault();
      state.timer.running ? timerPause() : timerStart();
      renderControl();
      break;
  }
});

    return `<div class="team-panel ${isTarget?'is-target':'is-off'}" style="--tc:${t.color}">
      <div class="tp-name" style="color:${t.color}">${t.name.toUpperCase()}</div>
      <div class="tp-sub">${isTarget ? 'Answering this question' : 'Not this question\u2019s team'}</div>
      ${isTarget ? `<div class="tp-marks">${marks}</div>` : `<div class="tp-locked-note">Waiting for their turn</div>`}
    </div>`;
  }).join('');

  view.innerHTML = `
    <div class="quick-wrap">
      <div class="quick-question">
        <div class="qc-sub mono">${esc(subj.name).toUpperCase()} &nbsp;·&nbsp; ${diff.label.toUpperCase()} &nbsp;·&nbsp; Q${pad2(q.numInSubject)}/20 &nbsp;·&nbsp; ${q.maxMarks} MARK${q.maxMarks>1?'S':''} MAX</div>
        <h2>Question ${state.currentGlobalIndex+1} of 100</h2>
      </div>
      <div class="team-grid">${panelsHtml}</div>
      <div class="next-q-bar">
        <button class="btn btn-primary next-q-btn" id="quickNextBtn" ${state.currentGlobalIndex===QUESTIONS.length-1?'disabled':''}>NEXT QUESTION →</button>
      </div>
    </div>
  `;

  $all('[data-mark]', view).forEach(b=> b.addEventListener('click', ()=>{
    const m = parseInt(b.dataset.mark,10);
    setAnswer(q.id, m);
    const team = TEAM_BY_KEY[q.team];
    flashSave(`${team.name} · ${m} mark${m===1?'':'s'} saved`);
    refreshTopbarStats();
    renderQuick();
  }));
  $('#quickNextBtn', view).addEventListener('click', ()=>{
    goToQuestion(state.currentGlobalIndex+1);
    refreshTopbarStats();
    renderQuick();
  });
}

/* =========================================================
   TIMER ENGINE v2 — centralized, synced across Score Control,
   Timer tab, and other browser tabs/windows via BroadcastChannel
   ========================================================= */
let audioCtx = null;
function playBeep(freq=880, dur=0.12){
  if(!state.timer.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq; osc.type='sine';
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
  }catch(e){ /* audio not available */ }
}
function showNotifBanner(msg){
  if(!state.timer.notifOn) return;
  let el = $('#notifBanner');
  if(!el){
    el = document.createElement('div');
    el.className = 'notif-banner';
    el.id = 'notifBanner';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 1800);
}

// --- cross-tab/window sync ---
let syncChannel = null;
try{ syncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel(SYNC_CHANNEL) : null; }catch(e){ syncChannel = null; }
function broadcastTimerState(){
  if(state._suppressBroadcast) return;
  const t = state.timer;
  const payload = {
    mode:t.mode, duration:t.duration, remaining:t.remaining, running:t.running, startTs:t.startTs,
    swElapsedBase:t.swElapsedBase, swRunning:t.swRunning, swStartTs:t.swStartTs, laps:t.laps, clock12h:t.clock12h,
  };
  try{ localStorage.setItem('tuqc_timer_sync', JSON.stringify({payload, ts:Date.now()})); }catch(e){}
  if(syncChannel){ try{ syncChannel.postMessage({type:'timer', payload}); }catch(e){} }
}
function applyRemoteTimerPayload(payload){
  state._suppressBroadcast = true;
  Object.assign(state.timer, payload);
  state._suppressBroadcast = false;
  if(state.activeTab==='timer') renderTimer();
  updateMiniTimerWidget();
  updateTimerDisplays();
}
if(syncChannel){
  syncChannel.onmessage = (ev)=>{ if(ev.data && ev.data.type==='timer') applyRemoteTimerPayload(ev.data.payload); };
}
window.addEventListener('storage', (ev)=>{
  if(ev.key==='tuqc_timer_sync' && ev.newValue){
    try{ applyRemoteTimerPayload(JSON.parse(ev.newValue).payload); }catch(e){}
  }
});

function getQuizElapsed(){
  const t = state.timer;
  if(t.quizRunning && t.quizStartTs){ return t.quizElapsedBase + (Date.now()-t.quizStartTs)/1000; }
  return t.quizElapsedBase;
}
function quizTimerStart(){ const t=state.timer; if(t.quizRunning) return; t.quizRunning=true; t.quizStartTs=Date.now(); }
function quizTimerPause(){ const t=state.timer; if(!t.quizRunning) return; t.quizElapsedBase=getQuizElapsed(); t.quizRunning=false; t.quizStartTs=null; }
function quizTimerReset(){ const t=state.timer; t.quizRunning=false; t.quizStartTs=null; t.quizElapsedBase=0; }

// countdown helpers
function getCountdownRemaining(){
  const t = state.timer;
  if(t.running && t.startTs!==null){ return Math.max(0, t.baseRemaining - (Date.now()-t.startTs)/1000); }
  return t.remaining;
}
function timerStart(){
  const t = state.timer;
  if(t.mode!=='countdown') t.mode='countdown';
  if(t.running) return;
  if(t.remaining<=0) t.remaining = t.duration;
  t.baseRemaining = t.remaining;
  t.running = true; t.startTs = Date.now();
  ensureMasterTick();
  broadcastTimerState();
}
function timerPause(){
  const t = state.timer;
  if(!t.running) return;
  t.remaining = getCountdownRemaining();
  t.running = false; t.startTs = null;
  broadcastTimerState();
}
function timerReset(){
  const t = state.timer;
  t.running = false; t.startTs = null;
  t.remaining = t.duration; t.baseRemaining = t.duration;
  updateTimerDisplays(); updateMiniTimerWidget();
  broadcastTimerState();
}
function timerAdjust(delta){
  const t = state.timer;
  if(t.running){ t.remaining = getCountdownRemaining(); t.running=false; t.startTs=null; t.remaining = clamp(t.remaining+delta,0,7200); t.baseRemaining=t.remaining; t.running=true; t.startTs=Date.now(); }
  else{ t.remaining = clamp(t.remaining+delta, 0, 7200); }
  updateTimerDisplays(); updateMiniTimerWidget();
  broadcastTimerState();
}
function timerSetDuration(sec){
  const t = state.timer;
  t.duration = sec;
  if(!t.running){ t.remaining = sec; }
  saveState();
  broadcastTimerState();
  if(state.activeTab==='timer') renderTimer();
  updateMiniTimerWidget();
}
// stopwatch helpers
function getStopwatchElapsed(){
  const t = state.timer;
  if(t.swRunning && t.swStartTs){ return t.swElapsedBase + (Date.now()-t.swStartTs)/1000; }
  return t.swElapsedBase;
}
function stopwatchStart(){ const t=state.timer; if(t.swRunning) return; t.swRunning=true; t.swStartTs=Date.now(); ensureMasterTick(); broadcastTimerState(); }
function stopwatchPause(){ const t=state.timer; if(!t.swRunning) return; t.swElapsedBase=getStopwatchElapsed(); t.swRunning=false; t.swStartTs=null; broadcastTimerState(); }
function stopwatchReset(){ const t=state.timer; t.swRunning=false; t.swStartTs=null; t.swElapsedBase=0; t.laps=[]; broadcastTimerState(); if(state.activeTab==='timer') renderTimer(); }
function stopwatchLap(){ const t=state.timer; t.laps.unshift(getStopwatchElapsed()); broadcastTimerState(); if(state.activeTab==='timer') renderTimer(); }

function formatStopwatch(sec){
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  const cs = Math.floor((sec*100)%100);
  return `${pad2(m)}:${pad2(s)}.${pad2(cs)}`;
}
function formatClockTime(date, is12h){
  let h = date.getHours(); const m = date.getMinutes(); const s = date.getSeconds();
  if(is12h){ const ampm = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12; return `${pad2(h)}:${pad2(m)}:${pad2(s)} ${ampm}`; }
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
}

let masterTickId = null;
let lastWarnedAt = null;
function ensureMasterTick(){
  if(masterTickId) return;
  masterTickId = setInterval(masterTick, 100);
}
function masterTick(){
  const t = state.timer;
  let anyRunning = t.running || t.swRunning || t.quizRunning;
  if(t.running){
    const rem = getCountdownRemaining();
    if(rem<=t.warnThreshold+0.05 && rem>t.warnThreshold-0.05 && lastWarnedAt!==Math.floor(rem)){
      lastWarnedAt = Math.floor(rem);
    }
    if(rem <= t.warnThreshold && rem>0.05){
      // continuous low-time state; play a single tick sound at each whole second
      const whole = Math.ceil(rem);
      if(state._lastWholeWarn!==whole){ state._lastWholeWarn = whole; playBeep(660,0.1); }
    }
    if(rem<=0){
      t.remaining = 0; t.running = false; t.startTs = null;
      playBeep(330,0.35);
      showNotifBanner("TIME'S UP");
      broadcastTimerState();
      if(state.activeTab==='timer') renderTimer();
    }
  }
  updateTimerDisplays();
  updateMiniTimerWidget();
  if(!anyRunning){ clearInterval(masterTickId); masterTickId=null; }
}
// keep a lightweight always-on ticker for the topbar quiz clock + running-clock mode
setInterval(()=>{
  if(state.timer.quizRunning || state.timer.mode==='clock'){ updateTimerDisplays(); }
  if(state.activeTab==='timer' && state.timer.mode==='clock'){ renderClockFace(); }
}, 1000);

function renderClockFace(){
  const el = $('#clockFace');
  if(el) el.textContent = formatClockTime(new Date(), state.timer.clock12h);
}

function updateTimerDisplays(){
  const t = state.timer;
  const rem = t.mode==='countdown' ? getCountdownRemaining() : t.remaining;
  const low = t.mode==='countdown' && rem<=t.warnThreshold && rem>0;
  const disp = $('#qTimerDisplay');
  if(disp){ disp.textContent = formatClock(rem); disp.classList.toggle('low', low); }
  const fsNum = $('#fsNum');
  if(fsNum){ fsNum.textContent = formatClock(rem); fsNum.classList.toggle('low', low); }
  const swDisp = $('#swDisplay');
  if(swDisp) swDisp.textContent = formatStopwatch(getStopwatchElapsed());
  const overallDisp = $('#quizElapsedDisplay');
  if(overallDisp) overallDisp.textContent = formatClock(getQuizElapsed());
  const topbarT = $('#topbarTimer');
  if(topbarT) topbarT.textContent = formatClock(getQuizElapsed());
  renderHostBar();
}

function updateMiniTimerWidget(){
  const t = state.timer;
  const rem = t.mode==='countdown' ? getCountdownRemaining() : t.remaining;
  const el = $('#miniTimerTime');
  if(!el) return;
  el.textContent = formatClock(rem);
  el.classList.toggle('low', rem<=t.warnThreshold && rem>0);
  const startBtn = $('#miniStartBtn');
  if(startBtn) startBtn.textContent = t.running ? '⏸ Pause' : '▶ Start';
}

    $('#qPlusBtn', view).addEventListener('click', ()=> timerAdjust(10));

const bonusTimer = { running:false, elapsedBase:0, startTs:null, intervalId:null };
function bonusElapsed(){ return bonusTimer.running ? bonusTimer.elapsedBase + (Date.now()-bonusTimer.startTs)/1000 : bonusTimer.elapsedBase; }
function ensureBonusTick(){
  if(bonusTimer.intervalId) return;
  bonusTimer.intervalId = setInterval(()=>{
    const el = $('#bonusTimerDisp');
    if(el) el.textContent = formatStopwatch(bonusElapsed());
    if(!bonusTimer.running){ clearInterval(bonusTimer.intervalId); bonusTimer.intervalId=null; }
  }, 50);
}

/* Keyboard shortcuts scoped to the Timer tab, plus global "T" to jump there */
document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if($('.modal-backdrop')) return;

  if(e.key==='t' || e.key==='T'){
    switchTab('timer'); return;
  }
  if(state.activeTab!=='timer') return;
  const t = state.timer;
  switch(e.key){
    case ' ': case 'Spacebar':
      e.preventDefault();
      if(t.mode==='countdown'){ t.running? timerPause() : timerStart(); }
      else if(t.mode==='stopwatch'){ t.swRunning? stopwatchPause() : stopwatchStart(); }
      renderTimer();
      break;
    case 'r': case 'R':
      if(t.mode==='countdown') timerReset(); else if(t.mode==='stopwatch') stopwatchReset();
      renderTimer();
      break;
    case 'l': case 'L':
      if(t.mode==='stopwatch') stopwatchLap();
      break;
    case '+': case '=':
      if(t.mode==='countdown') timerAdjust(10);
      break;
    case '-': case '_':
      if(t.mode==='countdown') timerAdjust(-10);
      break;
  }
});

let lbLastOrder = null; // for FLIP animation

function computeRanks(stats){
  // Standard competition ranking (1224): equal scores share the same rank
  const sorted = [...stats].sort((a,b)=> b.score-a.score || a.teamKey.localeCompare(b.teamKey));
  let rank = 1;
  return sorted.map((s,i)=>{
    if(i>0 && sorted[i-1].score===s.score) { /* same rank as previous */ }
    else rank = i+1;
    return { ...s, rank };
  });
}

function renderLeaderboard(){
  const view = $('#view-leaderboard');
  const ranked = computeRanks(TEAMS.map(t=>computeTeamStats(t.key)));
  const rankGroups = {};
  ranked.forEach(s=>{ (rankGroups[s.rank] = rankGroups[s.rank]||[]).push(s); });

  view.innerHTML = `
    <div class="panel">
      <div class="panel-title">🏆 LIVE LEADERBOARD — ACTUAL SCORES ONLY, NO PREDICTIONS</div>
      <div class="lb-list" id="lbList">
        ${ranked.map((s)=>{
          const team = TEAM_BY_KEY[s.teamKey];
          const isTie = rankGroups[s.rank].length>1;
          const accuracy = (s.correct+s.wrong+s.partial)>0 ? (s.correct/(s.correct+s.wrong+s.partial)*100) : 0;
          const avgMark = s.answered>0 ? (s.score/s.answered) : 0;
          return `<div class="lb-row" data-team="${s.teamKey}" style="--tc:${team.color}">
            <div class="lb-rank ${s.rank===1?'r1':''} mono">${s.rank}</div>
            <div class="lb-team-block">

              <div class="lb-bar-wrap"><div class="progress-track"><div class="progress-fill" style="width:${s.pct}%; background:${team.color}"></div></div></div>
            </div>
            <div class="lb-score-block">
              <div class="lb-score mono">${s.score}<span class="max"> / ${s.max}</span></div>
              <div class="lb-detail-row">
                <span><b>${s.pct.toFixed(1)}%</b></span>
                <span><b>${s.answered}</b>/${s.total} played</span>
                <span><b>${accuracy.toFixed(0)}%</b> acc.</span>
                <span><b>${avgMark.toFixed(1)}</b> avg</span>
                <span style="color:var(--green)">${s.correct} ✓</span>
                <span style="color:var(--red)">${s.wrong} ✕</span>
                <span style="color:var(--yellow)">${s.partial} ◐</span>
                <span>${s.unanswered} pending</span>
              </div>
            </div>
          </div>`;
        }).join('')}

  const newOrder = ranked.map(s=>s.teamKey);
  if(lbLastOrder){

      const oldIdx = lbLastOrder.indexOf(key);
      const newIdx = newOrder.indexOf(key);
      if(oldIdx>-1 && oldIdx!==newIdx){
        const delta = (oldIdx-newIdx) * (row.offsetHeight+12);
        row.style.transform = `translateY(${delta}px)`;
        requestAnimationFrame(()=>{ row.style.transform = 'translateY(0)'; });
      }
    });
  }
  lbLastOrder = newOrder;
}

const FINALE_TEAM_COLORS_CONFETTI = ['#ff4757','#2ed573','#ffc93c','#4c6fff','#ffb020','#fff'];
function ordinalLabel(rank){ return rank===1?'1ST':rank===2?'2ND':rank===3?'3RD':rank+'TH'; }

function renderFinale(){
  const view = $('#view-finale');
  const step = state.finale.step;

  const ranked = computeRanks(TEAMS.map(t=>computeTeamStats(t.key)));
  const rankVals = [...new Set(ranked.map(r=>r.rank))].sort((a,b)=>a-b);
  const groups = rankVals.map(rv=> ({ rank:rv, teams: ranked.filter(r=>r.rank===rv) }));
  const totalSteps = groups.length + 3; // 1 intro, 1 hidden board, (groups.length-1) reveals, 1 suspense, 1 champion
  const suspenseStep = totalSteps - 1;
  const champStep = totalSteps;

  if(step===0){
    const prog = overallProgress();
    view.innerHTML = `
      <div class="finale-stage">
        ${ICONS.trophy.replace('<svg', '<svg style="width:64px;height:64px;color:var(--gold);margin-bottom:22px;"')}
        <div class="fl-big" style="opacity:1;">GRAND FINALE</div>
        <div class="fl-line" style="opacity:1; max-width:480px;">
          ${prog.answered<prog.total ? `${prog.answered} of ${prog.total} questions have been scored. You can reveal the winner at any time.` : 'All 100 questions have been scored. Ready for the reveal.'}
        </div>
        <div class="finale-controls">
          <button class="btn btn-primary next-q-btn" id="revealBtn">🏆 REVEAL WINNER</button>
        </div>
      </div>
    `;
    $('#revealBtn', view).addEventListener('click', ()=>{ state.finale.step = 1; renderFinale(); });
    return;
  }

  let bodyHtml = '';

  if(step===1){
    bodyHtml = `
      <div class="fl-big" style="opacity:1;">THE QUIZ IS COMPLETE.</div>
      <div class="finale-hint" style="opacity:1;">100 QUESTIONS &nbsp;·&nbsp; 5 SUBJECTS &nbsp;·&nbsp; 300 MARKS &nbsp;·&nbsp; ONE FINAL RESULT</div>
    `;
  } else {
    const revealedBottomCount = step<=2 ? 0 : (step<=suspenseStep-1 ? step-2 : groups.length-1);
    const rows = groups.map((g,gi)=>{
      const distFromBottom = groups.length-1-gi;
      const isTopGroup = gi===0;
      const revealed = isTopGroup ? (step===champStep) : (distFromBottom < revealedBottomCount);
      return { g, revealed };
    });

    let suspenseLine = '';
    if(step>=3 && step<=suspenseStep-1){
      const gi = groups.length - (step-2);
      suspenseLine = `IN ${ordinalLabel(groups[gi].rank)} PLACE...`;
    } else if(step===suspenseStep){
      suspenseLine = groups[0].teams.length>1
        ? 'AND NOW... THE CHAMPIONS OF THE ULTIMATE QUIZ CHALLENGE ARE...'
        : 'AND NOW... THE CHAMPION OF THE ULTIMATE QUIZ CHALLENGE IS...';
    }

    const rankRowsHtml = rows.map(({g,revealed})=>{
      const placeLabel = ordinalLabel(g.rank);
      const isTie = g.teams.length>1;
      return g.teams.map(s=>{
        const team = TEAM_BY_KEY[s.teamKey];
        return `<div class="finale-rank-row ${revealed?'revealed':''}" style="--tc:${team.color}">
          <div class="fr-place">${placeLabel}${isTie&&revealed?'<span class="tie-badge">TIE</span>':''}</div>
          <div class="fr-team" style="color:${revealed?team.color:'var(--text-faint)'}">${revealed? team.name.toUpperCase()+' TEAM' : '?????'}</div>
          <div class="fr-score mono">${revealed? s.score+' / '+s.max : '???'}</div>
        </div>`;
      }).join('');
    }).join('');

    bodyHtml = `
      ${step<champStep ? `<div class="fl-line" style="opacity:1;">${suspenseLine||'THE STANDINGS'}</div>` : ''}
      <div class="finale-ranklist">${rankRowsHtml}</div>
      ${step===champStep ? `
        <div class="finale-champion">
          <div class="fl-line" style="opacity:1; color:var(--gold);">${groups[0].teams.length>1?"IT'S A TIE!":'THE CHAMPION IS'}</div>
          ${groups[0].teams.map(s=> `<div class="champ-name" style="--tc:${TEAM_BY_KEY[s.teamKey].color}">${TEAM_BY_KEY[s.teamKey].name.toUpperCase()} TEAM</div>`).join('<div class="fl-line" style="opacity:1;">&amp;</div>')}
          <div class="finale-hint">Final score: ${groups[0].teams[0].score} / ${groups[0].teams[0].max} marks${groups[0].teams.length>1?' each':''}</div>
        </div>
      ` : ''}
    `;
  }

  const isLast = step>=champStep;
  view.innerHTML = `
    <div class="finale-stage" id="finaleStageEl">
      ${bodyHtml}
      <div class="finale-controls">
        ${step>1 ? `<button class="btn btn-ghost" id="finaleBackBtn">← Back</button>` : ''}
        ${!isLast ? `<button class="btn btn-primary next-q-btn" id="finaleNextBtn">Continue ▶</button>` : `<button class="btn btn-ghost" id="finaleReplayBtn">↺ Replay finale</button>`}
      </div>
      <div class="finale-hint">Press <kbd style="background:var(--panel-3);border:1px solid var(--border);border-radius:5px;padding:2px 6px;">Space</kbd> to continue at your own pace</div>
    </div>
  `;

  if(step>1) $('#finaleBackBtn', view).addEventListener('click', ()=>{ state.finale.step -= 1; renderFinale(); });
  if(!isLast) $('#finaleNextBtn', view).addEventListener('click', advanceFinale);
  else $('#finaleReplayBtn', view).addEventListener('click', ()=>{ state.finale.step = 0; renderFinale(); });

  if(step===champStep) launchConfetti();
}

function finaleTotalSteps(){
  const ranked = computeRanks(TEAMS.map(t=>computeTeamStats(t.key)));
  const groupCount = new Set(ranked.map(r=>r.rank)).size;
  return groupCount + 3;
}
function advanceFinale(){
  if(state.finale.step >= finaleTotalSteps()) return;
  state.finale.step += 1;
  renderFinale();
}

document.addEventListener('keydown', (e)=>{
  if(state.activeTab!=='finale') return;
  if(e.code==='Space'){
    e.preventDefault();
    if(state.finale.step===0) return; // require explicit reveal click first
    if(state.finale.step<finaleTotalSteps()) advanceFinale();
  }
});

function launchConfetti(){
  const stage = $('#finaleStageEl');
  if(!stage) return;
  for(let i=0;i<70;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.background = FINALE_TEAM_COLORS_CONFETTI[Math.floor(Math.random()*FINALE_TEAM_COLORS_CONFETTI.length)];
    piece.style.animationDuration = (2.2+Math.random()*1.8)+'s';
    piece.style.animationDelay = (Math.random()*0.6)+'s';
    stage.appendChild(piece);
    setTimeout(()=> piece.remove(), 5000);
  }
}

/* =========================================================
   MODAL SYSTEM (generic)
   ========================================================= */
function openModal(html, {onClose}={}){
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.id = 'activeModal';
  el.innerHTML = html;
  el.addEventListener('mousedown', (e)=>{ if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  el._onClose = onClose;
  $all('.modal-close', el).forEach(b=> b.addEventListener('click', closeModal));
  return el;
}
function closeModal(){
  const el = $('#activeModal');
  if(el){ if(el._onClose) el._onClose(); el.remove(); }
}
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* =========================================================
   SETTINGS PANEL
   ========================================================= */
function openSettingsModal(){
  const el = openModal(`
    <div class="modal-box">
      <div class="modal-head"><h3>⚙ Settings</h3><span class="modal-close">✕</span></div>
      <div class="modal-body">
        <div class="settings-section">
          <h4>Quiz — Teams</h4>
          ${TEAMS.map(t=>`
            <div class="team-name-edit">
              <span class="swatch" style="background:${t.color}"></span>
              <input type="text" data-team-name="${t.key}" value="${esc(t.name)}" style="flex:1;">
              <input type="color" data-team-color="${t.key}" value="${t.color}">
            </div>`).join('')}
        </div>
        <div class="settings-section">
          <h4>Quiz — Subjects</h4>
          ${SUBJECTS.map(s=>`
            <div class="settings-row">
              <span class="swatch" style="background:${s.color}; width:14px; height:14px; border-radius:4px; display:inline-block; margin-right:8px;"></span>
              <input type="text" data-subject-name="${s.key}" value="${esc(s.name)}" style="flex:1;">
            </div>`).join('')}
        </div>
        <div class="settings-section">
          <h4>Timer defaults</h4>
          <div class="settings-row"><label>Default question duration (sec)</label><input type="number" id="setDefDur" value="${state.timer.duration}" min="1" max="600"></div>
          <div class="settings-row"><label>Warning threshold (sec)</label><input type="number" id="setWarnThresh" value="${state.timer.warnThreshold}" min="1" max="60"></div>
          <div class="settings-row"><label>Sound warnings</label><span class="switch"><input type="checkbox" id="setSound" ${state.timer.soundOn?'checked':''}><span class="slider"></span></span></div>
          <div class="settings-row"><label>Auto-start timer on question open</label><span class="switch"><input type="checkbox" id="setAutoStart" ${state.settings.questionTimerAutoStart?'checked':''}><span class="slider"></span></span></div>
          <div class="settings-row"><label>Auto-reset timer for each new question</label><span class="switch"><input type="checkbox" id="setAutoReset" ${state.settings.questionTimerAutoReset?'checked':''}><span class="slider"></span></span></div>
          <div class="settings-row"><label>Auto Advance after scoring</label><span class="switch"><input type="checkbox" id="setAutoAdvance" ${state.settings.autoAdvance?'checked':''}><span class="slider"></span></span></div>
        </div>
        <div class="settings-section">
          <h4>Interface</h4>
          <div class="settings-row"><label>Density</label>
            <select id="setDensity"><option value="comfortable" ${state.settings.density==='comfortable'?'selected':''}>Comfortable</option><option value="compact" ${state.settings.density==='compact'?'selected':''}>Compact</option></select>
          </div>
          <div class="settings-row"><label>Animations</label><span class="switch"><input type="checkbox" id="setAnimations" ${state.settings.animations?'checked':''}><span class="slider"></span></span></div>
          <div class="settings-row"><label>Presentation mode</label><button class="btn btn-sm" id="setPresentBtn">Enter presentation mode</button></div>
        </div>
        <div class="settings-section">
          <h4>Data</h4>
          <div class="settings-row"><label>Export full session (JSON)</label><button class="btn btn-sm" id="exportJsonBtn">Export JSON</button></div>
          <div class="settings-row"><label>Import session (JSON)</label><label class="btn btn-sm" style="cursor:pointer;">Choose file<input type="file" id="importJsonInput" accept="application/json" style="display:none;"></label></div>
          <div class="settings-row"><label>Export results (CSV)</label><button class="btn btn-sm" id="exportCsvBtn">Export CSV</button></div>
          <div class="settings-row"><label>Reset entire quiz</label><button class="btn btn-sm" style="border-color:var(--red); color:var(--red);" id="resetQuizBtn">Reset Quiz</button></div>
          <div class="settings-row"><label>Clear saved session</label><button class="btn btn-sm" style="border-color:var(--red); color:var(--red);" id="clearSessionBtn">Clear Session</button></div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-primary modal-close">Done</button></div>
    </div>
  `, { onClose: ()=> { saveState(); rerenderAll(); } });

  $all('[data-team-name]', el).forEach(inp=> inp.addEventListener('change', ()=>{
    const key = inp.dataset.teamName;
    const val = inp.value.trim();
    if(!val){ toast('Team name cannot be empty','err'); inp.value = TEAM_BY_KEY[key].name; return; }
    TEAM_BY_KEY[key].name = val; saveState(); rerenderAll();
  }));
  $all('[data-team-color]', el).forEach(inp=> inp.addEventListener('change', ()=>{
    TEAM_BY_KEY[inp.dataset.teamColor].color = inp.value; saveState(); rerenderAll();
  }));
  $all('[data-subject-name]', el).forEach(inp=> inp.addEventListener('change', ()=>{
    const key = inp.dataset.subjectName;
    const val = inp.value.trim();
    if(!val){ toast('Subject name cannot be empty','err'); inp.value = SUBJECT_BY_KEY[key].name; return; }
    SUBJECT_BY_KEY[key].name = val; saveState(); rerenderAll();
  }));
  $('#setDefDur', el).addEventListener('change', (e)=>{ const v=clamp(parseInt(e.target.value,10)||20,1,600); timerSetDuration(v); });
  $('#setWarnThresh', el).addEventListener('change', (e)=>{ state.timer.warnThreshold = clamp(parseInt(e.target.value,10)||5,1,60); saveState(); });
  $('#setSound', el).addEventListener('change', (e)=>{ state.timer.soundOn = e.target.checked; saveState(); });
  $('#setAutoStart', el).addEventListener('change', (e)=>{ state.settings.questionTimerAutoStart = e.target.checked; saveState(); });
  $('#setAutoReset', el).addEventListener('change', (e)=>{ state.settings.questionTimerAutoReset = e.target.checked; saveState(); });
  $('#setAutoAdvance', el).addEventListener('change', (e)=>{ state.settings.autoAdvance = e.target.checked; saveState(); });
  $('#setDensity', el).addEventListener('change', (e)=>{ state.settings.density = e.target.value; document.body.classList.toggle('density-compact', e.target.value==='compact'); saveState(); });
  $('#setAnimations', el).addEventListener('change', (e)=>{ state.settings.animations = e.target.checked; document.body.classList.toggle('no-anim', !e.target.checked); saveState(); });
  $('#setPresentBtn', el).addEventListener('click', ()=>{ closeModal(); togglePresentationMode(); });
  $('#exportJsonBtn', el).addEventListener('click', exportSessionJSON);
  $('#exportCsvBtn', el).addEventListener('click', exportResultsCSV);
  $('#resetQuizBtn', el).addEventListener('click', ()=>{
    if(confirm('Reset ALL scores for the entire quiz? This cannot be undone.')){
      state.answers = defaultAnswerState(); state.history=[]; goToQuestion(0); saveState();
      closeModal(); rerenderAll(); toast('Quiz reset', 'info');
    }
  });
  $('#clearSessionBtn', el).addEventListener('click', ()=>{
    if(confirm('Clear the saved session from this browser? Current on-screen data stays until you reload.')){
      clearSavedState(); toast('Saved session cleared', 'info');
    }
  });
  $('#importJsonInput', el).addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!validateImportedSession(data)){ toast('Invalid session file — import cancelled', 'err'); return; }
        applySavedPayload(data);
        goToQuestion(state.currentGlobalIndex||0);
        saveState();
        closeModal();
        rerenderAll();
        toast('Session imported successfully');
      }catch(err){ toast('Could not read that file as JSON', 'err'); }
    };
    reader.readAsText(file);
  });
}

function validateImportedSession(data){
  if(!data || typeof data!=='object') return false;
  if(!data.answers || typeof data.answers!=='object') return false;
  for(const q of QUESTIONS){
    const a = data.answers[q.id];
    if(a===undefined) continue; // allow partial imports
    if(typeof a!=='object') return false;
    if(a.marks!==null && a.marks!==undefined){
      if(typeof a.marks!=='number' || a.marks<0 || a.marks>q.maxMarks || isNaN(a.marks)) return false;
    }
    if(a.status && !['unanswered','correct','wrong','partial'].includes(a.status)) return false;
  }
  return true;
}

function exportSessionJSON(){
  const payload = {
    answers: state.answers, currentGlobalIndex: state.currentGlobalIndex,
    timer:{ duration:state.timer.duration, soundOn:state.timer.soundOn, notifOn:state.timer.notifOn, warnThreshold:state.timer.warnThreshold, displayMode:state.timer.displayMode, presets:state.timer.presets, clock12h:state.timer.clock12h },
    settings: state.settings, questionTimerDurations: state.questionTimerDurations,
    teams: TEAMS.map(t=>({key:t.key,name:t.name,color:t.color,dark:t.dark})),
    subjects: SUBJECTS.map(s=>({key:s.key,name:s.name})),
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `quiz-session-${dateStr}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Session exported');
}

function csvEscape(v){
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportResultsCSV(){
  const rows = [['Team','Subject','Question','Difficulty','MaxMarks','MarksObtained','Status']];
  QUESTIONS.forEach(q=>{
    const a = state.answers[q.id];
    rows.push([
      TEAM_BY_KEY[q.team].name, SUBJECT_BY_KEY[q.subject].name, q.numInSubject,
      DIFF_BY_KEY[q.difficulty].label, q.maxMarks, a.marks===null?'':a.marks, a.status,
    ]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `quiz-results-${dateStr}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Results CSV exported');
}

/* =========================================================
   PRESENTATION MODE
   ========================================================= */
function togglePresentationMode(){
  state.presentationMode = !state.presentationMode;
  document.body.classList.toggle('presentation', state.presentationMode);
  if(state.presentationMode){
    switchTab('control');
    let btn = $('#exitPresentBtn');
    if(!btn){
      btn = document.createElement('button');
      btn.id = 'exitPresentBtn';
      btn.className = 'btn btn-primary exit-presentation-btn';
      btn.textContent = 'Exit presentation ✕';
      btn.addEventListener('click', togglePresentationMode);
      document.body.appendChild(btn);
    }
    if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(()=>{}); }
  } else {
    const btn = $('#exitPresentBtn'); if(btn) btn.remove();
    if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(()=>{}); }
  }
}

/* =========================================================
   RECOVERY MODAL
   ========================================================= */
function showRecoveryModal(){
  openModal(`
    <div class="modal-box" style="max-width:440px;">
      <div class="modal-body" style="text-align:center; padding-top:30px;">
        <div class="recovery-icon" style="margin-left:auto; margin-right:auto;">${ICONS.clock}</div>
        <h3 style="margin-bottom:8px;">Previous quiz session recovered</h3>
        <p style="color:var(--text-faint); font-size:13px; margin-bottom:22px;">We found saved progress from your last session in this browser. Would you like to resume where you left off, or start a brand new session?</p>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn btn-ghost" id="startNewBtn">Start New Session</button>
          <button class="btn btn-primary" id="resumeBtn">Resume</button>
        </div>
      </div>
    </div>
  `, { onClose: ()=>{} });
  $('#resumeBtn').addEventListener('click', ()=>{
    loadState();
    closeModal();
    goToQuestion(state.currentGlobalIndex||0);
    applyInterfaceSettings();
    rerenderAll();
    toast('Session resumed', 'info');
  });
  $('#startNewBtn').addEventListener('click', ()=>{
    clearSavedState();
    closeModal();
    toast('Started a new session', 'info');
  });
}

/* =========================================================
   INIT
   ========================================================= */
function applyInterfaceSettings(){
  document.body.classList.toggle('density-compact', state.settings.density==='compact');
  document.body.classList.toggle('no-anim', !state.settings.animations);
}
function init(){
  const shouldRecover = hasSavedProgress();
  goToQuestion(0);
  renderShell();
  renderActiveView();
  applyInterfaceSettings();
  if(shouldRecover){ showRecoveryModal(); }
}
init();
</script>

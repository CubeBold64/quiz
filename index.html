<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ultimate Quiz Challenge — Live Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2305060a%22/><rect x=%2218%22 y=%2218%22 width=%2228%22 height=%2228%22 fill=%22%23ff4757%22/><rect x=%2254%22 y=%2218%22 width=%2228%22 height=%2228%22 fill=%22%232ed573%22/><rect x=%2218%22 y=%2254%22 width=%2228%22 height=%2228%22 fill=%22%23ffc93c%22/><rect x=%2254%22 y=%2254%22 width=%2228%22 height=%2228%22 fill=%22%234c6fff%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#05060a;
  --bg-grid: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
  --panel:#0e1019;
  --panel-2:#151827;
  --panel-3:#1b1f31;
  --border:#262a3d;
  --border-soft:#1a1d2b;
  --text:#eef0f7;
  --text-dim:#8b90a8;
  --text-faint:#565c78;
  --gold:#ffb020;
  --gold-dim:#8a611f;
  --red:#ff4757;
  --green:#2ed573;
  --yellow:#ffc93c;
  --blue:#4c6fff;
  --math:#2ec4ff;
  --sci:#16c79a;
  --soc:#ff9f45;
  --gk:#a66cff;
  --eng:#ff5c8a;
  --radius-sm:9px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    linear-gradient(180deg, rgba(76,111,255,0.06), transparent 320px),
    var(--bg-grid) 0 0/22px 22px,
    var(--bg);
  color:var(--text);
  font-family:'Space Grotesk', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono', 'Courier New', monospace;}
h1,h2,h3,h4{margin:0; font-family:'Space Grotesk', sans-serif; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold); color:#1a1200;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

/* ===== App shell ===== */
#app{display:flex; flex-direction:column; min-height:100vh;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:18px;
  padding:12px 22px;
  background:rgba(9,10,16,0.86);
  backdrop-filter: blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand-mark{width:30px; height:30px; border-radius:8px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; flex-shrink:0;}
.brand-mark span{display:block;}
.brand-mark span:nth-child(1){background:var(--red);}
.brand-mark span:nth-child(2){background:var(--green);}
.brand-mark span:nth-child(3){background:var(--yellow);}
.brand-mark span:nth-child(4){background:var(--blue);}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text strong{font-size:14.5px; font-weight:700; letter-spacing:-0.01em;}
.brand-text small{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.04em;}

.tabs{display:flex; gap:4px; background:var(--panel); border:1px solid var(--border-soft); border-radius:12px; padding:4px; flex:1; min-width:0; overflow-x:auto;}
.tab-btn{
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  padding:9px 14px; border-radius:9px; border:none; background:transparent;
  color:var(--text-dim); font-weight:600; font-size:13px; transition:background .15s, color .15s;
}
.tab-btn svg{width:15px; height:15px; flex-shrink:0;}
.tab-btn:hover{color:var(--text); background:var(--panel-2);}
.tab-btn.active{color:#0a0a0f; background:var(--gold);}

.topbar-stats{display:flex; align-items:center; gap:16px; flex-shrink:0;}
.stat-chip{display:flex; flex-direction:column; align-items:flex-end; line-height:1.15;}
.stat-chip .v{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;}
.stat-chip .l{font-size:9.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.05em;}

.view{flex:1; padding:22px; max-width:1440px; width:100%; margin:0 auto; display:none;}
.view.active{display:block;}

/* ===== Generic building blocks ===== */
.panel{
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:20px;
}
.panel-title{font-size:12px; font-weight:700; color:var(--text-faint); letter-spacing:0.06em; margin-bottom:14px;}
.btn{
  border:1px solid var(--border);
  background:var(--panel-3);
  color:var(--text);
  padding:10px 16px;
  border-radius:10px;
  font-weight:600;
  font-size:13.5px;
  transition:transform .1s ease, background .15s, border-color .15s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{background:#232739; border-color:#333853;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold); border-color:var(--gold); color:#181000;}
.btn-primary:hover{background:#ffc043;}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:0.35; cursor:not-allowed; pointer-events:none;}

.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:100px; font-size:11.5px; font-weight:700; letter-spacing:0.03em;}

.progress-track{height:7px; border-radius:6px; background:var(--panel-3); overflow:hidden; position:relative;}
.progress-fill{height:100%; border-radius:6px; transition:width .4s cubic-bezier(.2,.8,.3,1);}

.grid-2{display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start;}
@media (max-width: 900px){ .grid-2{grid-template-columns:1fr;} }

.empty-note{color:var(--text-faint); font-size:13px; padding:20px; text-align:center;}

/* ===== Subject tabs ===== */
.subject-tabs{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.subject-tab{
  flex:1; min-width:160px;
  background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  padding:12px 14px; text-align:left; color:var(--text);
  position:relative; overflow:hidden;
}
.subject-tab .top-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.subject-tab .name{font-weight:700; font-size:12.5px; letter-spacing:0.01em;}
.subject-tab .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);}
.subject-tab.active{border-color:var(--sub-color, var(--gold)); box-shadow:0 0 0 1px var(--sub-color, var(--gold)) inset;}
.subject-tab::after{content:""; position:absolute; left:0; top:0; height:3px; width:100%; background:var(--sub-color,var(--gold)); opacity:.9;}

/* ===== Question navigator ===== */
.qnav-panel{position:sticky; top:76px;}
.qnav-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
.qnav-cell{
  aspect-ratio:1; border-radius:9px; border:1px solid var(--border);
  background:var(--panel-3); color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  position:relative; transition:transform .1s;
}
.qnav-cell:hover{transform:translateY(-1px); border-color:#3a4060;}
.qnav-cell.st-correct{background:rgba(46,213,115,0.16); border-color:var(--green); color:var(--green);}
.qnav-cell.st-wrong{background:rgba(255,71,87,0.14); border-color:var(--red); color:var(--red);}
.qnav-cell.st-partial{background:rgba(255,201,60,0.14); border-color:var(--yellow); color:var(--yellow);}
.qnav-cell.current{outline:2px solid var(--gold); outline-offset:2px;}
.qnav-legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; font-size:11px; color:var(--text-faint);}
.qnav-legend .dot{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px;}

/* ===== Question card (Score Control) ===== */
.qcard{padding:26px;}
.qcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
.qcard-num{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:700; line-height:1;}
.qcard-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;}
.team-pill{padding:5px 13px; border-radius:100px; font-weight:700; font-size:12px; letter-spacing:0.02em;}
.diff-pill{padding:5px 13px; border-radius:100px; font-weight:700; font-size:12px; letter-spacing:0.02em; background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim);}
.max-badge{text-align:right;}
.max-badge .v{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--gold);}
.max-badge .l{font-size:10.5px; color:var(--text-faint); font-weight:600; letter-spacing:0.05em;}

.mark-grid{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0;}
.mark-btn{
  width:72px; height:72px; border-radius:16px; border:1.5px solid var(--border);
  background:var(--panel-3); color:var(--text);
  font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700;
  transition:all .12s ease;
}
.mark-btn:hover{border-color:var(--gold); transform:translateY(-2px);}
.mark-btn.selected{background:var(--gold); border-color:var(--gold); color:#181000; transform:translateY(-2px); box-shadow:0 6px 18px rgba(255,176,32,0.35);}
.mark-btn.pending{outline:2px dashed var(--gold); outline-offset:3px;}

.quick-actions{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.qa-btn{flex:1; min-width:120px; padding:13px; border-radius:12px; font-weight:700; font-size:13px; border:1.5px solid var(--border); background:var(--panel-3); color:var(--text-dim); letter-spacing:0.03em;}
.qa-btn.correct-btn:hover{border-color:var(--green); color:var(--green);}
.qa-btn.partial-btn:hover{border-color:var(--yellow); color:var(--yellow);}
.qa-btn.wrong-btn:hover{border-color:var(--red); color:var(--red);}

.qcard-footer{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap;}
.save-btn{padding:14px 34px; font-size:14.5px; border-radius:12px;}
.nav-btns{display:flex; gap:8px;}

.save-flash{
  position:fixed; top:90px; left:50%; transform:translateX(-50%) translateY(-10px); opacity:0;
  background:var(--green); color:#062; font-weight:700; padding:11px 22px; border-radius:100px;
  font-size:13.5px; box-shadow:0 10px 30px rgba(46,213,115,0.4); pointer-events:none; z-index:100;
  transition:opacity .25s, transform .25s;
  display:flex; align-items:center; gap:8px;
}
.save-flash.show{opacity:1; transform:translateX(-50%) translateY(0);}
.save-flash svg{width:18px; height:18px; flex-shrink:0;}
.save-flash{white-space:nowrap;}

.kbd-hint{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; font-size:11px; color:var(--text-faint);}
.kbd-hint kbd{background:var(--panel-3); border:1px solid var(--border); border-radius:5px; padding:2px 6px; font-family:'IBM Plex Mono',monospace; color:var(--text-dim); margin-right:4px;}

/* ===== Quick mode ===== */
.quick-wrap{max-width:1180px; margin:0 auto;}
.quick-question{text-align:center; margin-bottom:26px;}
.quick-question .qc-sub{color:var(--text-faint); font-weight:600; font-size:12.5px; letter-spacing:0.05em; margin-bottom:10px;}
.quick-question h2{font-size:22px; margin-bottom:4px;}
.team-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media (max-width:820px){.team-grid{grid-template-columns:repeat(2,1fr);}}
.team-panel{
  border-radius:var(--radius-lg); padding:20px; border:2px solid var(--border-soft); background:var(--panel);
  position:relative; transition:opacity .2s, border-color .2s; text-align:center;
}
.team-panel.is-target{border-color:var(--tc); box-shadow:0 0 0 1px var(--tc) inset, 0 12px 30px -10px var(--tc);}
.team-panel.is-off{opacity:0.4;}
.team-panel .tp-name{font-weight:700; font-size:15px; margin-bottom:2px;}
.team-panel .tp-sub{font-size:11px; color:var(--text-faint); margin-bottom:16px;}
.team-panel .tp-marks{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.team-panel .tp-mark-btn{
  width:44px; height:44px; border-radius:11px; border:1.5px solid var(--border); background:var(--panel-3);
  color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px;
}
.team-panel .tp-mark-btn.selected{background:var(--tc); border-color:var(--tc); color:#08090c;}
.team-panel .tp-locked-note{font-size:11px; color:var(--text-faint); font-style:italic; padding:10px 0;}
.next-q-bar{display:flex; justify-content:center; margin-top:30px;}
.next-q-btn{padding:17px 44px; font-size:16px; border-radius:14px;}

/* ===== Timer ===== */
.timer-wrap{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media (max-width:900px){.timer-wrap{grid-template-columns:1fr;}}
.timer-display{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:76px; text-align:center; letter-spacing:0.02em; margin:14px 0; transition:color .2s;}
.timer-display.low{color:var(--red); animation:pulse-warn 1s infinite;}
@keyframes pulse-warn{0%,100%{opacity:1;}50%{opacity:.45;}}
.timer-controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
.duration-row{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; justify-content:center;}
.dur-btn{padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--panel-3); color:var(--text-dim); font-weight:600; font-size:12.5px;}
.dur-btn.active{background:var(--gold); border-color:var(--gold); color:#181000;}
.custom-dur{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:8px;}
.custom-dur input{width:80px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel-3); color:var(--text); font-family:'IBM Plex Mono',monospace;}
.toggle-row{display:flex; gap:18px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.toggle{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); font-weight:600;}
.toggle input{accent-color:var(--gold); width:15px; height:15px;}
.fs-timer-btn{display:flex; justify-content:center; margin-top:16px;}
.notif-banner{
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-16px); opacity:0;
  background:var(--red); color:#fff; font-weight:700; padding:13px 26px; border-radius:14px;
  z-index:200; transition:all .25s; pointer-events:none; box-shadow:0 12px 30px rgba(255,71,87,.4);
}
.notif-banner.show{opacity:1; transform:translateX(-50%) translateY(0);}

#fullscreenTimer{
  position:fixed; inset:0; background:#000; z-index:500; display:none;
  align-items:center; justify-content:center; flex-direction:column;
}
#fullscreenTimer.show{display:flex;}
#fullscreenTimer .fs-num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:min(38vw,340px); line-height:1; color:var(--text);}
#fullscreenTimer .fs-num.low{color:var(--red);}
#fullscreenTimer .fs-exit{position:absolute; top:26px; right:26px;}
#fullscreenTimer .fs-label{color:var(--text-faint); font-size:16px; letter-spacing:0.1em; font-weight:600; margin-top:-10px;}

/* ===== Leaderboard ===== */
.lb-list{display:flex; flex-direction:column; gap:12px;}
.lb-row{
  display:grid; grid-template-columns:56px 1fr auto; gap:16px; align-items:center;
  background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
  padding:16px 20px; position:relative; overflow:hidden;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.lb-row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--tc);}
.lb-rank{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; color:var(--text-faint); text-align:center;}
.lb-rank.r1{color:var(--gold);}
.lb-team{display:flex; align-items:center; gap:12px;}
.lb-dot{width:14px; height:14px; border-radius:4px; background:var(--tc); flex-shrink:0;}
.lb-name{font-weight:700; font-size:16px;}
.lb-bar-wrap{margin-top:8px;}
.lb-score-block{text-align:right; min-width:190px;}
.lb-score{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700;}
.lb-score .max{color:var(--text-faint); font-size:15px; font-weight:600;}
.lb-detail-row{display:flex; gap:14px; margin-top:6px; justify-content:flex-end; font-size:11px; color:var(--text-faint);}
.lb-detail-row b{color:var(--text-dim);}

/* ===== Analytics ===== */
.analytics-section{margin-bottom:26px;}
.section-heading{font-size:13px; font-weight:700; color:var(--text-dim); letter-spacing:0.04em; margin-bottom:14px; display:flex; align-items:center; gap:10px;}
.section-heading::after{content:""; flex:1; height:1px; background:var(--border-soft);}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:1000px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.team-stat-card{border-radius:var(--radius-lg); padding:18px; background:var(--panel); border:1px solid var(--border-soft); border-top:3px solid var(--tc);}
.team-stat-card h4{font-size:15px; margin-bottom:14px;}
.mini-stat{display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; border-bottom:1px dashed var(--border-soft);}
.mini-stat:last-child{border-bottom:none;}
.mini-stat span:first-child{color:var(--text-faint);}
.mini-stat span:last-child{font-family:'IBM Plex Mono',monospace; font-weight:600;}

.subject-table{width:100%; border-collapse:separate; border-spacing:0 8px; font-size:12.5px;}
.subject-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; letter-spacing:0.04em; padding:0 12px 6px;}
.subject-table td{background:var(--panel); padding:12px; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);}
.subject-table td:first-child{border-left:1px solid var(--border-soft); border-radius:10px 0 0 10px;}
.subject-table td:last-child{border-right:1px solid var(--border-soft); border-radius:0 10px 10px 0;}
.subject-table td.num{font-family:'IBM Plex Mono',monospace; text-align:center;}

.diff-cards{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
@media (max-width:1000px){.diff-cards{grid-template-columns:repeat(2,1fr);}}
.diff-card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:14px;}
.diff-card h5{font-size:12.5px; margin-bottom:10px; color:var(--text-dim);}
.diff-mini{display:flex; justify-content:space-between; font-size:11px; padding:3px 0; color:var(--text-faint);}
.diff-mini b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.charts-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
@media (max-width:980px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px; height:300px; display:flex; flex-direction:column;}
.chart-box h5{font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:0.03em; margin-bottom:10px;}
.chart-box .chart-holder{flex:1; position:relative;}

.qa-table-wrap{max-height:480px; overflow:auto; border-radius:var(--radius-md); border:1px solid var(--border-soft);}
table.qa-table{width:100%; border-collapse:collapse; font-size:12px;}
table.qa-table th{position:sticky; top:0; background:#161a29; text-align:left; padding:9px 12px; color:var(--text-faint); font-weight:600; z-index:2;}
table.qa-table td{padding:8px 12px; border-top:1px solid var(--border-soft);}
table.qa-table tr:hover td{background:var(--panel-2);}
.filter-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.filter-chip{padding:6px 13px; border-radius:100px; border:1px solid var(--border); background:var(--panel-3); color:var(--text-dim); font-size:12px; font-weight:600;}
.filter-chip.active{background:var(--gold); border-color:var(--gold); color:#181000;}

/* ===== Grand Finale ===== */
.finale-stage{
  min-height:72vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; position:relative; border-radius:var(--radius-lg); overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%, #12162a 0%, #05060a 70%);
  border:1px solid var(--border-soft);
  padding:40px 20px;
}

.finale-ranklist{display:flex; flex-direction:column; gap:14px; width:100%; max-width:560px; margin:14px auto;}

.confetti-piece{position:absolute; top:-20px; width:10px; height:16px; opacity:0.9; animation:confetti-fall linear forwards;}

  to{ transform:translateY(110vh) rotate(600deg); opacity:0; }
}

@media (max-width: 640px){
  .qcard-num{font-size:26px;}
  .mark-btn{width:60px; height:60px; font-size:21px;}
  .timer-display{font-size:52px;}
  .brand-text small{display:none;}
  .brand-text strong{font-size:12px;}
  .tab-btn span{display:none;}
  .tab-btn{padding:9px 10px;}
  .tab-btn svg{width:16px; height:16px;}
  .topbar{gap:8px; padding:10px 12px; flex-wrap:wrap;}
  .tabs{order:3; flex:1 1 100%; width:100%;}
  .topbar-stats{gap:10px;}
  .stat-chip .v{font-size:12px;}
  .stat-chip .l{font-size:7.5px;}
  .lb-row{grid-template-columns:40px 1fr; row-gap:10px;}
  .lb-score-block{grid-column:1 / -1; text-align:left; min-width:0;}
  .lb-detail-row{justify-content:flex-start;}
  .grid-2{grid-template-columns:1fr;}
  .qnav-panel{position:static;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="fullscreenTimer">
  <button class="btn btn-ghost fs-exit" id="fsExitBtn">Exit fullscreen ✕</button>
  <div class="fs-num mono" id="fsNum">00:20</div>
  <div class="fs-label" id="fsLabel">QUESTION TIMER</div>
</div>

<script>
'use strict';
/* =========================================================
   DATA MODEL
   ========================================================= */
const TEAMS = [
  {key:'RED',    name:'Red',    color:'#ff4757', dark:false},
  {key:'GREEN',  name:'Green',  color:'#2ed573', dark:false},
  {key:'YELLOW', name:'Yellow', color:'#ffc93c', dark:true},
  {key:'BLUE',   name:'Blue',   color:'#4c6fff', dark:false},
];
const TEAM_BY_KEY = Object.fromEntries(TEAMS.map(t=>[t.key,t]));

const SUBJECTS = [
  {key:'MATH', name:'Mathematics',          short:'MATH', color:'#2ec4ff'},
  {key:'SCI',  name:'Science',              short:'SCI',  color:'#16c79a'},
  {key:'SOC',  name:'Social Science',       short:'SOC',  color:'#ff9f45'},
  {key:'GK',   name:'GK & Current Affairs', short:'GK',   color:'#a66cff'},
  {key:'ENG',  name:'English',              short:'ENG',  color:'#ff5c8a'},
];
const SUBJECT_BY_KEY = Object.fromEntries(SUBJECTS.map(s=>[s.key,s]));

const DIFFICULTIES = [
  {key:'EASY',     label:'Easy',      max:1},
  {key:'EASY_MID', label:'Easy-Mid',  max:2},
  {key:'MEDIUM',   label:'Medium',    max:3},
  {key:'MID_HARD', label:'Mid-Hard',  max:4},
  {key:'HARD',     label:'Hard',      max:5},
];
const DIFF_BY_KEY = Object.fromEntries(DIFFICULTIES.map(d=>[d.key,d]));

function buildQuestions(){
  const qs = [];
  let globalIndex = 0;
  SUBJECTS.forEach(subject=>{
    for(let n=1;n<=20;n++){
      const diff = DIFFICULTIES[Math.floor((n-1)/4)];
      const team = TEAMS[(n-1)%4];
      qs.push({
        id: subject.key+'-'+n,
        globalIndex: globalIndex++,
        subject: subject.key,
        numInSubject: n,
        difficulty: diff.key,
        maxMarks: diff.max,
        team: team.key,
      });
    }
  });
  return qs;
}
const QUESTIONS = buildQuestions(); // 100 questions, order = play order
const TOTAL_MARKS = QUESTIONS.reduce((s,q)=>s+q.maxMarks,0); // 300
const TEAM_MAX = {}; TEAMS.forEach(t=>{ TEAM_MAX[t.key] = QUESTIONS.filter(q=>q.team===t.key).reduce((s,q)=>s+q.maxMarks,0); }); // 75 each

/* =========================================================
   STATE
   ========================================================= */
const STORAGE_KEY = 'tuqc_live_control_v1';

function defaultAnswerState(){
  const a = {};
  QUESTIONS.forEach(q=>{ a[q.id] = { marks:null, status:'unanswered', timeUsed:null }; });
  return a;
}

const state = {
  activeTab: 'control',
  currentGlobalIndex: 0,
  currentSubject: 'MATH',
  answers: defaultAnswerState(),
  history: [], // undo stack: {qid, prev}
  pendingMark: null, // number key pressed but not yet confirmed with Enter
  qaFilter: 'ALL',
  timer: {
    quizRunning:false, quizStartTs:null, quizElapsedBase:0,
    qDuration:20, qRemaining:20, qRunning:false, qIntervalId:null,
    soundOn:true, notifOn:true,
  },
  finale: { step:0 }, // 0=not started
};

function saveState(){
  try{
    const payload = { answers: state.answers, timer:{ qDuration: state.timer.qDuration, soundOn:state.timer.soundOn, notifOn:state.timer.notifOn } };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  }catch(e){ console.warn('Could not save state', e); }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const payload = JSON.parse(raw);
    if(payload.answers){
      Object.keys(state.answers).forEach(id=>{
        if(payload.answers[id]) state.answers[id] = payload.answers[id];
      });
    }
    if(payload.timer){
      state.timer.qDuration = payload.timer.qDuration ?? 20;
      state.timer.qRemaining = state.timer.qDuration;
      state.timer.soundOn = payload.timer.soundOn ?? true;
      state.timer.notifOn = payload.timer.notifOn ?? true;
    }
  }catch(e){ console.warn('Could not load saved state', e); }
}

/* =========================================================
   UTILITIES
   ========================================================= */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function formatClock(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  if(h>0) return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  return `${pad2(m)}:${pad2(s)}`;
}
function questionByGlobalIndex(i){ return QUESTIONS[i]; }
function questionsForSubject(subjKey){ return QUESTIONS.filter(q=>q.subject===subjKey); }

function deriveStatus(marks, maxMarks){
  if(marks===null || marks===undefined) return 'unanswered';
  if(marks<=0) return 'wrong';
  if(marks>=maxMarks) return 'correct';
  return 'partial';
}

function setAnswer(qid, marks){
  const q = QUESTIONS.find(x=>x.id===qid);
  const prev = { ...state.answers[qid] };
  const clamped = clamp(marks, 0, q.maxMarks);
  state.answers[qid] = { marks: clamped, status: deriveStatus(clamped, q.maxMarks), timeUsed: state.answers[qid].timeUsed };
  state.history.push({ qid, prev });
  if(state.history.length>200) state.history.shift();
  saveState();
}
function resetAnswer(qid){
  const prev = { ...state.answers[qid] };
  state.answers[qid] = { marks:null, status:'unanswered', timeUsed:null };
  state.history.push({ qid, prev });
  saveState();
}
function undoLast(){
  const last = state.history.pop();
  if(!last) return false;
  state.answers[last.qid] = last.prev;
  saveState();
  return true;
}

/* Team / subject / difficulty stats — purely factual, no predictions */
function computeTeamStats(teamKey){
  const qs = QUESTIONS.filter(q=>q.team===teamKey);
  let score=0, correct=0, wrong=0, partial=0, unanswered=0, answered=0, remainingPossible=0;
  qs.forEach(q=>{
    const a = state.answers[q.id];
    if(a.status==='unanswered'){ unanswered++; remainingPossible += q.maxMarks; }
    else{
      answered++;
      score += (a.marks||0);
      if(a.status==='correct') correct++;
      else if(a.status==='wrong') wrong++;
      else if(a.status==='partial') partial++;
    }
  });
  const max = TEAM_MAX[teamKey];
  return { teamKey, score, max, pct: max? (score/max*100):0, correct, wrong, partial, unanswered, answered, total:qs.length, remainingPossible };
}
function computeSubjectStats(subjKey){
  const qs = questionsForSubject(subjKey);
  const subjMax = qs.reduce((s,q)=>s+q.maxMarks,0);
  const perTeam = {};
  TEAMS.forEach(t=>perTeam[t.key]=0);
  let answeredCount=0;
  qs.forEach(q=>{
    const a = state.answers[q.id];
    if(a.status!=='unanswered'){ perTeam[q.team]+=(a.marks||0); answeredCount++; }
  });
  const totalScored = Object.values(perTeam).reduce((a,b)=>a+b,0);
  return { subjKey, subjMax, perTeam, totalScored, pct: subjMax? totalScored/subjMax*100:0, answeredCount, total:qs.length };
}
function computeDifficultyStats(diffKey){
  const qs = QUESTIONS.filter(q=>q.difficulty===diffKey);
  const max = qs.reduce((s,q)=>s+q.maxMarks,0);
  let scored=0, correct=0, answered=0;
  const perTeam={}; TEAMS.forEach(t=>perTeam[t.key]={score:0,max:0});
  qs.forEach(q=>{
    perTeam[q.team].max += q.maxMarks;
    const a = state.answers[q.id];
    if(a.status!=='unanswered'){
      answered++; scored += (a.marks||0); perTeam[q.team].score += (a.marks||0);
      if(a.status==='correct') correct++;
    }
  });
  return { diffKey, max, scored, pct: max? scored/max*100:0, accuracy: answered? correct/answered*100:0, answered, total:qs.length, perTeam };
}
function overallProgress(){
  const answered = QUESTIONS.filter(q=>state.answers[q.id].status!=='unanswered').length;
  return { answered, total: QUESTIONS.length };
}

/* =========================================================
   ICONS (minimal inline SVG, stroke style)
   ========================================================= */
const ICONS = {
  control: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2.2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2.2" fill="currentColor" stroke="none"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/><path d="M12 13v3"/><path d="M8 20h8"/><path d="M9 20c0-2 1.3-3 3-3s3 1 3 3"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.3l7.1-.7z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
};

/* =========================================================
   RENDER: APP SHELL
   ========================================================= */
const TABS = [
  {key:'control', label:'Score Control', icon:'control'},
  {key:'quick',   label:'Quick Mode',    icon:'bolt'},
  {key:'timer',   label:'Timer',         icon:'clock'},
  {key:'leaderboard', label:'Leaderboard', icon:'trophy'},
  {key:'analytics', label:'Analytics',   icon:'chart'},
  {key:'finale',  label:'Finale',        icon:'star'},
];

function renderShell(){
  const app = $('#app');
  const prog = overallProgress();
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <div class="brand-text"><strong>ULTIMATE QUIZ CHALLENGE</strong><small>LIVE CONTROL ROOM</small></div>
      </div>
      <div class="tabs" role="tablist">
        ${TABS.map(t=>`<button class="tab-btn ${state.activeTab===t.key?'active':''}" data-tab="${t.key}">${ICONS[t.icon]}<span>${t.label}</span></button>`).join('')}
      </div>
      <div class="topbar-stats">
        <div class="stat-chip"><span class="v mono">${prog.answered}/${prog.total}</span><span class="l">ANSWERED</span></div>
        <div class="stat-chip"><span class="v mono" id="topbarTimer">${formatClock(getQuizElapsed())}</span><span class="l">QUIZ TIME</span></div>
      </div>
    </div>
    <div class="view" id="view-control"></div>
    <div class="view" id="view-quick"></div>
    <div class="view" id="view-timer"></div>
    <div class="view" id="view-leaderboard"></div>
    <div class="view" id="view-analytics"></div>
    <div class="view" id="view-finale"></div>
    <div class="save-flash" id="saveFlash">${ICONS.check} <span id="saveFlashText">Saved</span></div>
  `;
  $all('.tab-btn').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)) );
  $('#view-'+state.activeTab).classList.add('active');
}

function switchTab(tab){
  state.activeTab = tab;
  $all('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  $all('.view').forEach(v=> v.classList.remove('active'));
  $('#view-'+tab).classList.add('active');
  renderActiveView();
}

function renderActiveView(){
  if(state.activeTab==='control') renderControl();
  else if(state.activeTab==='quick') renderQuick();
  else if(state.activeTab==='timer') renderTimer();
  else if(state.activeTab==='leaderboard') renderLeaderboard();
  else if(state.activeTab==='analytics') renderAnalytics();
  else if(state.activeTab==='finale') renderFinale();
}

function refreshTopbarStats(){
  const prog = overallProgress();
  const chip = $('.topbar-stats');
  if(!chip) return;
  chip.innerHTML = `
    <div class="stat-chip"><span class="v mono">${prog.answered}/${prog.total}</span><span class="l">ANSWERED</span></div>
    <div class="stat-chip"><span class="v mono" id="topbarTimer">${formatClock(getQuizElapsed())}</span><span class="l">QUIZ TIME</span></div>
  `;
}

function flashSave(text){
  const el = $('#saveFlash');
  if(!el) return;
  $('#saveFlashText').textContent = text || 'Saved';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 1100);
}

function rerenderAll(){
  refreshTopbarStats();
  renderActiveView();
}

/* =========================================================
   RENDER: SCORE CONTROL
   ========================================================= */
function currentQuestion(){ return questionByGlobalIndex(state.currentGlobalIndex); }

function goToQuestion(globalIndex, {resetPending=true}={}){
  state.currentGlobalIndex = clamp(globalIndex, 0, QUESTIONS.length-1);
  state.currentSubject = currentQuestion().subject;
  if(resetPending) state.pendingMark = null;
}

function renderControl(){
  const view = $('#view-control');
  const q = currentQuestion();
  const subj = SUBJECT_BY_KEY[q.subject];
  const diff = DIFF_BY_KEY[q.difficulty];
  const team = TEAM_BY_KEY[q.team];
  const a = state.answers[q.id];

  const subjectTabsHtml = SUBJECTS.map(s=>{
    const qs = questionsForSubject(s.key);
    const done = qs.filter(qq=>state.answers[qq.id].status!=='unanswered').length;
    return `<button class="subject-tab ${s.key===state.currentSubject?'active':''}" style="--sub-color:${s.color}" data-subject="${s.key}">
      <div class="top-row"><span class="name">${esc(s.name)}</span><span class="count mono">${done}/20</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${done/20*100}%; background:${s.color}"></div></div>
    </button>`;
  }).join('');

  const navQs = questionsForSubject(state.currentSubject);
  const navGridHtml = navQs.map(qq=>{
    const st = state.answers[qq.id].status;
    const isCurrent = qq.globalIndex===state.currentGlobalIndex;
    return `<button class="qnav-cell st-${st} ${isCurrent?'current':''}" data-goto="${qq.globalIndex}" title="Q${qq.numInSubject} · ${DIFF_BY_KEY[qq.difficulty].label} · ${TEAM_BY_KEY[qq.team].name}">${pad2(qq.numInSubject)}</button>`;
  }).join('');

  const marksButtons = Array.from({length:q.maxMarks+1}, (_,m)=>{
    const isSelected = a.marks===m;
    const isPending = state.pendingMark===m;
    return `<button class="mark-btn ${isSelected?'selected':''} ${isPending?'pending':''}" data-mark="${m}">${m}</button>`;
  }).join('');

  view.innerHTML = `
    <div class="subject-tabs">${subjectTabsHtml}</div>
    <div class="grid-2">
      <div class="panel qnav-panel">
        <div class="panel-title">QUESTION NAVIGATOR — ${esc(subj.name).toUpperCase()}</div>
        <div class="qnav-grid">${navGridHtml}</div>
        <div class="qnav-legend">
          <span><span class="dot" style="background:var(--panel-3); border:1px solid var(--border);"></span>Not attempted</span>
          <span><span class="dot" style="background:var(--green);"></span>Correct</span>
          <span><span class="dot" style="background:var(--yellow);"></span>Partial</span>
          <span><span class="dot" style="background:var(--red);"></span>Wrong</span>
          <span><span class="dot" style="background:var(--gold);"></span>Current</span>
        </div>
      </div>
      <div class="panel qcard">
        <div class="qcard-head">
          <div>
            <div class="qcard-num mono">Q${pad2(q.numInSubject)}<span style="color:var(--text-faint); font-size:16px;"> / 20</span></div>
            <div class="qcard-meta">
              <span class="pill" style="background:${subj.color}22; color:${subj.color}; border:1px solid ${subj.color}55;">${esc(subj.name)}</span>
              <span class="diff-pill">${diff.label}</span>
              <span class="team-pill" style="background:${team.color}; color:${team.dark?'#181000':'#fff'};">${team.name.toUpperCase()} TEAM</span>
            </div>
          </div>
          <div class="max-badge">
            <div class="v mono">${q.maxMarks}</div>
            <div class="l">MAX MARK${q.maxMarks>1?'S':''}</div>
          </div>
        </div>

        <div class="mark-grid">${marksButtons}</div>

        <div class="quick-actions">
          <button class="qa-btn correct-btn" data-quick="correct">✓ CORRECT (${q.maxMarks})</button>
          <button class="qa-btn partial-btn" data-quick="partial">◐ PARTIAL (${Math.ceil(q.maxMarks/2)})</button>
          <button class="qa-btn wrong-btn" data-quick="wrong">✕ WRONG (0)</button>
        </div>

        <div class="qcard-footer">
          <div class="nav-btns">
            <button class="btn btn-ghost" id="prevBtn" ${state.currentGlobalIndex===0?'disabled':''}>← Prev</button>
            <button class="btn btn-ghost" id="undoBtn">Undo</button>
            <button class="btn btn-ghost" id="resetBtn">Reset</button>
          </div>
          <button class="btn btn-primary save-btn" id="saveBtn">SAVE</button>
          <button class="btn btn-ghost" id="nextBtn" ${state.currentGlobalIndex===QUESTIONS.length-1?'disabled':''}>Next →</button>
        </div>

        <div class="kbd-hint">
          <span><kbd>0</kbd>–<kbd>${q.maxMarks}</kbd> select mark</span>
          <span><kbd>Enter</kbd> save</span>
          <span><kbd>←</kbd><kbd>→</kbd> or <kbd>P</kbd>/<kbd>N</kbd> navigate</span>
          <span><kbd>U</kbd> undo</span>
          <span><kbd>R</kbd> reset</span>
        </div>
      </div>
    </div>
  `;

  // listeners
  $all('[data-subject]', view).forEach(b=> b.addEventListener('click', ()=>{
    state.currentSubject = b.dataset.subject;
    const first = questionsForSubject(state.currentSubject)[0];
    goToQuestion(first.globalIndex);
    renderControl();
  }));
  $all('[data-goto]', view).forEach(b=> b.addEventListener('click', ()=>{
    goToQuestion(parseInt(b.dataset.goto,10));
    renderControl();
  }));
  $all('[data-mark]', view).forEach(b=> b.addEventListener('click', ()=>{
    const m = parseInt(b.dataset.mark,10);
    setAnswer(q.id, m);
    state.pendingMark = null;
    flashSave(`Q${q.numInSubject} · ${team.name} · ${m} mark${m===1?'':'s'} saved`);
    rerenderAll();
  }));
  $all('[data-quick]', view).forEach(b=> b.addEventListener('click', ()=>{
    const kind = b.dataset.quick;
    const m = kind==='correct' ? q.maxMarks : kind==='wrong' ? 0 : Math.ceil(q.maxMarks/2);
    setAnswer(q.id, m);
    flashSave(`Marked ${kind.toUpperCase()}`);
    rerenderAll();
  }));
  $('#saveBtn', view).addEventListener('click', ()=>{
    const m = state.pendingMark!==null ? state.pendingMark : (a.marks!==null? a.marks : 0);
    setAnswer(q.id, m);
    state.pendingMark = null;
    flashSave('Saved');
    rerenderAll();
  });
  $('#prevBtn', view).addEventListener('click', ()=>{ goToQuestion(state.currentGlobalIndex-1); renderControl(); });
  $('#nextBtn', view).addEventListener('click', ()=>{ goToQuestion(state.currentGlobalIndex+1); renderControl(); });
  $('#undoBtn', view).addEventListener('click', ()=>{ if(undoLast()){ flashSave('Undone'); rerenderAll(); } });
  $('#resetBtn', view).addEventListener('click', ()=>{ resetAnswer(q.id); flashSave('Reset'); rerenderAll(); });
}

/* Keyboard shortcuts for Score Control */
document.addEventListener('keydown', (e)=>{
  if(state.activeTab!=='control') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  const q = currentQuestion();
  if(/^[0-9]$/.test(e.key)){
    const m = parseInt(e.key,10);
    if(m<=q.maxMarks){ state.pendingMark = m; renderControl(); }
    return;
  }
  switch(e.key){
    case 'Enter':{
      const m = state.pendingMark!==null ? state.pendingMark : (state.answers[q.id].marks ?? 0);
      setAnswer(q.id, m); state.pendingMark=null;
      flashSave('Saved'); rerenderAll();
      break;
    }
    case 'ArrowRight': case 'n': case 'N':
      goToQuestion(state.currentGlobalIndex+1); renderControl(); break;
    case 'ArrowLeft': case 'p': case 'P':
      goToQuestion(state.currentGlobalIndex-1); renderControl(); break;
    case 'u': case 'U':
      if(undoLast()){ flashSave('Undone'); rerenderAll(); }
      break;
    case 'r': case 'R':
      resetAnswer(q.id); flashSave('Reset'); rerenderAll();
      break;
  }
});

/* =========================================================
   TIMER ENGINE
   ========================================================= */
function getQuizElapsed(){
  const t = state.timer;
  if(t.quizRunning && t.quizStartTs){
    return t.quizElapsedBase + (Date.now()-t.quizStartTs)/1000;
  }
  return t.quizElapsedBase;
}
function quizTimerStart(){
  const t = state.timer;
  if(t.quizRunning) return;
  t.quizRunning = true; t.quizStartTs = Date.now();
}
function quizTimerPause(){
  const t = state.timer;
  if(!t.quizRunning) return;
  t.quizElapsedBase = getQuizElapsed(); t.quizRunning = false; t.quizStartTs = null;
}
function quizTimerReset(){
  const t = state.timer;
  t.quizRunning = false; t.quizStartTs = null; t.quizElapsedBase = 0;
}

let audioCtx = null;
function playBeep(freq=880, dur=0.12){
  if(!state.timer.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq; osc.type='sine';
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+dur);
  }catch(e){ /* audio not available */ }
}

function showNotifBanner(msg){
  if(!state.timer.notifOn) return;
  let el = $('#notifBanner');
  if(!el){
    el = document.createElement('div');
    el.className = 'notif-banner';
    el.id = 'notifBanner';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 1800);
}

function qTimerTick(){
  const t = state.timer;
  if(!t.qRunning) return;
  t.qRemaining -= 0.1;
  if(t.qRemaining <= 5.05 && t.qRemaining > 4.9){ showNotifBanner('5 seconds remaining!'); playBeep(660,0.15); }
  if(t.qRemaining <= 0){
    t.qRemaining = 0; t.qRunning = false;
    clearInterval(t.qIntervalId); t.qIntervalId = null;
    playBeep(330, 0.3);
    showNotifBanner("TIME'S UP");
    if(state.activeTab==='timer') renderTimer();
    return;
  }
  updateTimerDisplays();
}
function qTimerStart(){
  const t = state.timer;
  if(t.qRunning) return;
  if(t.qRemaining<=0) t.qRemaining = t.qDuration;
  t.qRunning = true;
  t.qIntervalId = setInterval(qTimerTick, 100);
}
function qTimerPause(){
  const t = state.timer;
  t.qRunning = false;
  if(t.qIntervalId){ clearInterval(t.qIntervalId); t.qIntervalId = null; }
}
function qTimerReset(){
  const t = state.timer;
  qTimerPause();
  t.qRemaining = t.qDuration;
  updateTimerDisplays();
}
function qTimerAdjust(delta){
  const t = state.timer;
  t.qRemaining = clamp(t.qRemaining + delta, 0, 3600);
  updateTimerDisplays();
}
function qTimerSetDuration(sec){
  const t = state.timer;
  t.qDuration = sec;
  if(!t.qRunning) t.qRemaining = sec;
  saveState();
  renderTimer();
}

function updateTimerDisplays(){
  const t = state.timer;
  const low = t.qRemaining<=5 && t.qRemaining>0;
  const atZero = t.qRemaining<=0;
  const disp = $('#qTimerDisplay');
  if(disp){
    disp.textContent = formatClock(t.qRemaining);
    disp.classList.toggle('low', low || (atZero && t.qDuration>0 && false));
  }
  const fsNum = $('#fsNum');
  if(fsNum){
    fsNum.textContent = formatClock(t.qRemaining);
    fsNum.classList.toggle('low', low);
  }
  const overallDisp = $('#quizElapsedDisplay');
  if(overallDisp) overallDisp.textContent = formatClock(getQuizElapsed());
  const topbarT = $('#topbarTimer');
  if(topbarT) topbarT.textContent = formatClock(getQuizElapsed());
}

// global tick to keep quiz stopwatch + topbar fresh regardless of active tab
setInterval(()=>{
  if(state.timer.quizRunning){ updateTimerDisplays(); }
}, 500);

    let running=0;
    const data = QUESTIONS.map(q=>{
      if(q.team===t.key){ const a = state.answers[q.id]; if(a.status!=='unanswered') running += (a.marks||0); }
      return running;
    });
    return { label:t.name, data, borderColor:t.color, backgroundColor:t.color+'22', tension:0.3, pointRadius:0, borderWidth:2 };
  });
  makeChart('chartProgression', {
    type:'line',
    data:{ labels:progLabels, datasets:progDatasets },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, scales:{ x:{ticks:{maxTicksLimit:10}, grid:{display:false}}, y:{beginAtZero:true, grid:{color:CHART_GRID}} } }
  });

  makeChart('chartSubject', {
    type:'bar',
    data:{ labels:SUBJECTS.map(s=>s.short), datasets: TEAMS.map(t=>({ label:t.name, data:subjStats.map(s=>s.perTeam[t.key]), backgroundColor:t.color, borderRadius:4 })) },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:false, grid:{display:false}}, y:{beginAtZero:true, grid:{color:CHART_GRID}} }, plugins:{legend:{labels:{boxWidth:10, font:{size:10}}}} }
  });

  makeChart('chartDifficulty', {
    type:'bar',
    data:{ labels:DIFFICULTIES.map(d=>d.label), datasets:[{ label:'Accuracy %', data:diffStats.map(d=>d.accuracy), backgroundColor:'#ffb020', borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, max:100, grid:{color:CHART_GRID}}, x:{grid:{display:false}} } }
  });

  const totalCorrect = teamStats.reduce((s,t)=>s+t.correct,0);
  const totalWrong = teamStats.reduce((s,t)=>s+t.wrong,0);
  const totalPartial = teamStats.reduce((s,t)=>s+t.partial,0);
  makeChart('chartCorrectWrong', {
    type:'doughnut',
    data:{ labels:['Correct','Wrong','Partial'], datasets:[{ data:[totalCorrect,totalWrong,totalPartial], backgroundColor:['#2ed573','#ff4757','#ffc93c'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}} }
  });

  makeChart('chartMaxVsCurrent', {
    type:'bar',
    data:{ labels:teamNames, datasets:[
      { label:'Current', data:teamStats.map(s=>s.score), backgroundColor:teamColors, borderRadius:6 },
      { label:'Maximum possible', data:teamStats.map(s=>s.max), backgroundColor:'rgba(255,255,255,0.08)', borderRadius:6 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{beginAtZero:true, grid:{color:CHART_GRID}}, x:{grid:{display:false}} } }
  });

  makeChart('chartPerQuestion', {
    type:'bar',
    data:{ labels: QUESTIONS.map(q=>q.numInSubject<=20? (SUBJECT_BY_KEY[q.subject].short+q.numInSubject):''), datasets:[{
      label:'Marks obtained', data:QUESTIONS.map(q=> state.answers[q.id].marks ?? 0),
      backgroundColor: QUESTIONS.map(q=> TEAM_BY_KEY[q.team].color), borderRadius:2, barPercentage:1, categoryPercentage:1,
    }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{maxTicksLimit:12, font:{size:9}}, grid:{display:false}}, y:{beginAtZero:true, max:5, grid:{color:CHART_GRID}} } }
  });

  makeChart('chartRadar', {
    type:'radar',
    data:{ labels:SUBJECTS.map(s=>s.short), datasets:TEAMS.map(t=>({
      label:t.name, data:subjStats.map(s=> s.subjMax? (s.perTeam[t.key]/ (s.subjMax) *100) : 0),
      borderColor:t.color, backgroundColor:t.color+'22', pointBackgroundColor:t.color, borderWidth:2,
    })) },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ r:{ angleLines:{color:CHART_GRID}, grid:{color:CHART_GRID}, pointLabels:{color:CHART_TEXT, font:{size:10}}, ticks:{display:false}, suggestedMin:0, suggestedMax:100 } }, plugins:{legend:{labels:{boxWidth:10, font:{size:10}}}} }
  });
}

/* =========================================================
   RENDER: GRAND FINALE
   ========================================================= */
const FINALE_TEAM_COLORS_CONFETTI = ['#ff4757','#2ed573','#ffc93c','#4c6fff','#ffb020','#fff'];

function renderFinale(){
  const view = $('#view-finale');
  const step = state.finale.step;

  if(step===0){
    const prog = overallProgress();
    view.innerHTML = `
      <div class="finale-stage">
        ${ICONS.trophy.replace('<svg', '<svg style="width:64px;height:64px;color:var(--gold);margin-bottom:22px;"')}
        <div class="fl-big" style="opacity:1;">GRAND FINALE</div>
        <div class="fl-line" style="opacity:1; max-width:480px;">
          ${prog.answered<prog.total ? `${prog.answered} of ${prog.total} questions have been scored. You can reveal the winner at any time.` : 'All 100 questions have been scored. Ready for the reveal.'}
        </div>
        <div class="finale-controls">
          <button class="btn btn-primary next-q-btn" id="revealBtn">🏆 REVEAL WINNER</button>
        </div>
      </div>
    `;
    $('#revealBtn', view).addEventListener('click', ()=>{ state.finale.step = 1; renderFinale(); });
    return;
  }

  const stats = TEAMS.map(t=>computeTeamStats(t.key)).sort((a,b)=> b.score-a.score || a.teamKey.localeCompare(b.teamKey));
  const revealedCount = { 2:0, 3:1, 4:2, 5:3, 6:3, 7:4 }[step] ?? 0; // how many *from the bottom* are revealed by this step (rank 1 waits until step 7)
  // step mapping: 1=intro lines, 2=hidden board, 3=reveal 4th, 4=reveal 3rd, 5=reveal 2nd, 6=suspense, 7=champion

  let bodyHtml = '';

  if(step===1){
    bodyHtml = `
      <div class="fl-big" style="opacity:1;">THE QUIZ IS COMPLETE.</div>
      <div class="finale-hint" style="opacity:1;">100 QUESTIONS &nbsp;·&nbsp; 5 SUBJECTS &nbsp;·&nbsp; 300 MARKS &nbsp;·&nbsp; ONE FINAL RESULT</div>
    `;
  } else {
    const rankRows = stats.map((s,i)=>{
      const rank = i+1; // 1 = winner
      const placeFromBottom = stats.length - rank + 1; // 4,3,2,1
      const isRevealed = placeFromBottom <= revealedCount || (step>=7 && rank===1);
      const team = TEAM_BY_KEY[s.teamKey];
      const placeLabel = rank===1 ? '1ST' : rank===2 ? '2ND' : rank===3 ? '3RD' : '4TH';
      return `<div class="finale-rank-row ${isRevealed?'revealed':''}" style="--tc:${team.color}">
        <div class="fr-place">${placeLabel}</div>
        <div class="fr-team" style="color:${isRevealed?team.color:'var(--text-faint)'}">${isRevealed? team.name.toUpperCase()+' TEAM' : '?????'}</div>
        <div class="fr-score mono">${isRevealed? s.score+' / '+s.max : '???'}</div>
      </div>`;
    }).join('');

    let suspenseLine = '';
    if(step===3) suspenseLine = 'IN 4TH PLACE...';
    else if(step===4) suspenseLine = 'IN 3RD PLACE...';
    else if(step===5) suspenseLine = 'IN 2ND PLACE...';
    else if(step===6) suspenseLine = 'AND NOW... THE CHAMPION OF THE ULTIMATE QUIZ CHALLENGE IS...';

    bodyHtml = `
      ${step<7 ? `<div class="fl-line" style="opacity:1;">${suspenseLine||'THE STANDINGS'}</div>` : ''}
      <div class="finale-ranklist">${rankRows}</div>
      ${step===7 ? `
        <div class="finale-champion">
          <div class="fl-line" style="opacity:1; color:var(--gold);">THE CHAMPION IS</div>
          <div class="champ-name" style="--tc:${TEAM_BY_KEY[stats[0].teamKey].color}">${stats[0] && TEAM_BY_KEY[stats[0].teamKey].name.toUpperCase()} TEAM</div>
          <div class="finale-hint">Final score: ${stats[0].score} / ${stats[0].max} marks</div>
        </div>
      ` : ''}
    `;
  }

  const isLast = step>=7;
  view.innerHTML = `
    <div class="finale-stage" id="finaleStageEl">
      ${bodyHtml}
      <div class="finale-controls">
        ${step>1 ? `<button class="btn btn-ghost" id="finaleBackBtn">← Back</button>` : ''}
        ${!isLast ? `<button class="btn btn-primary next-q-btn" id="finaleNextBtn">Continue ▶</button>` : `<button class="btn btn-ghost" id="finaleReplayBtn">↺ Replay finale</button>`}
      </div>
      <div class="finale-hint">Press <kbd style="background:var(--panel-3);border:1px solid var(--border);border-radius:5px;padding:2px 6px;">Space</kbd> to continue at your own pace</div>
    </div>
  `;

  if(step>1) $('#finaleBackBtn', view).addEventListener('click', ()=>{ state.finale.step -= 1; renderFinale(); });
  if(!isLast) $('#finaleNextBtn', view).addEventListener('click', advanceFinale);
  else $('#finaleReplayBtn', view).addEventListener('click', ()=>{ state.finale.step = 0; renderFinale(); });

  if(step===7) launchConfetti();
}

function advanceFinale(){
  state.finale.step += 1;
  renderFinale();
}

document.addEventListener('keydown', (e)=>{
  if(state.activeTab!=='finale') return;
  if(e.code==='Space'){
    e.preventDefault();
    if(state.finale.step===0) return; // require explicit reveal click first
    if(state.finale.step<7) advanceFinale();
  }
});

function launchConfetti(){
  const stage = $('#finaleStageEl');
  if(!stage) return;
  for(let i=0;i<70;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.background = FINALE_TEAM_COLORS_CONFETTI[Math.floor(Math.random()*FINALE_TEAM_COLORS_CONFETTI.length)];
    piece.style.animationDuration = (2.2+Math.random()*1.8)+'s';
    piece.style.animationDelay = (Math.random()*0.6)+'s';
    stage.appendChild(piece);
    setTimeout(()=> piece.remove(), 5000);
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  loadState();
  goToQuestion(0);
  renderShell();
  renderActiveView();
}
init();
</script>
